      '<div class="d">'+(plan?Math.round(used*100)+"% of "+money(plan)+" used":"no plan set yet")+'</div></div>'+
  '</div>';

  // headline under the spending chart
  var headline="";
  if(sc.upto>0&&sc.prevSame>0){
    var diff=sc.cur-sc.prevSame;
    headline='<b class="num">'+money(sc.cur)+'</b> spent so far — '+
      (Math.abs(diff)<1?'right where you were last month':
       '<b style="color:'+(diff>0?"var(--crit)":"var(--good)")+'">'+money(Math.abs(diff))+' '+(diff>0?"more":"less")+'</b> than this point last month');
  } else if(sc.upto>0){
    headline='<b class="num">'+money(sc.cur)+'</b> spent so far this month';
  } else {
    headline='Nothing spent yet in '+ymLabel(m);
  }

  return demoBanner()+tiles+
  '<div class="grid dash">'+
    '<section class="panel c8"><div class="panel-h"><h2>Spending</h2><button class="more" data-go="budget">Budget →</button></div>'+
      '<div class="legend" style="font-size:13px;color:var(--ink-2)">'+headline+'</div>'+
      '<div class="legend"><span><i style="background:var(--s1)"></i>'+ymLabel(m)+'</span>'+
        '<span><i style="background:var(--s6)"></i>'+ymLabel(pm)+'</span>'+
        (sc.target?'<span><i class="dash"></i>Even pace to '+money(sc.target)+'</span>':'')+'</div>'+
      '<div class="chartbox">'+sc.svg+'<div class="tip"></div></div></section>'+
    '<section class="panel c4"><div class="panel-h"><h2>To do</h2></div>'+todoList(s,plan)+'</section>'+
    '<section class="panel c6">'+budgetSnapshot(m,s)+'</section>'+
    '<section class="panel c6">'+cashFlowCard(m)+'</section>'+
    '<section class="panel c7"><div class="panel-h"><h2>Recent transactions</h2><button class="more" data-go="txns">All transactions →</button></div>'+
      miniTxnList(allTxns().slice().sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); }),8,{compact:true})+'</section>'+
    '<section class="panel c5">'+upcomingCard()+'</section>'+
    '<section class="panel c7">'+accountsCard()+'</section>'+
    '<section class="panel c5">'+goalsCard()+'</section>'+
  '</div>';
}

function todoList(s,plan){
  var rows=[], nc=unreviewed().length, nd=flagged().length;
  var stale=accountStatus().filter(function(x){ return x.stale; });
  var over=S.cats.filter(function(c){ return c.group==="spend"; }).filter(function(c){
    var b=budgetFor(c.id,S.month); return b>0&&Math.abs(monthCat(S.month,c.id))>b;
  });
  var soon=recurringList().filter(function(x){
    return x.cadence.months>=6&&x.nextDate&&x.nextDate>=todayIso()&&x.nextDate<=isoFromDay(dayNum(todayIso())+30);
  });
  function row(cls,ic,title,sub,btn){
    return '<div class="todo-row"><span class="ic '+cls+'">'+icon(ic)+'</span><span class="tx"><b>'+title+'</b><span>'+sub+'</span></span>'+btn+'</div>';
  }
  if(nc) rows.push(row("crit","tag",nc+" to categorize","Answers are remembered for next time",'<button class="btn sm" data-go="review" data-revtab="cat">Review</button>'));
  if(nd) rows.push(row("warn","copy",nd+" possible duplicate"+(nd===1?"":"s"),"Same amount, close dates",'<button class="btn sm" data-go="review" data-revtab="dup">Check</button>'));
  if(stale.length) rows.push(row("","import",stale.length+" account"+(stale.length===1?"":"s")+" due a download",
    stale.slice(0,2).map(function(x){ return esc(x.acct.label); }).join(", ")+(stale.length>2?" +"+(stale.length-2):""),
    '<button class="btn sm" data-go="import">Import</button>'));
  if(over.length) rows.push(row("crit","alert",over.length+" categor"+(over.length===1?"y":"ies")+" over plan",
    over.slice(0,2).map(function(c){ return esc(c.name); }).join(", ")+(over.length>2?" +"+(over.length-2):""),
    '<button class="btn sm" data-go="budget">See</button>'));
  if(soon.length) rows.push(row("","calendar",soon.length+" renewal"+(soon.length===1?"":"s")+" in 30 days",
    soon.slice(0,2).map(function(x){ return esc(x.name)+" "+money(x.amount); }).join(", "),
    '<button class="btn sm" data-go="recurring">View</button>'));
  if(!rows.length) rows.push(row("good","check","All caught up","Nothing waiting on you",""));
  return '<div class="todo">'+rows.join("")+'</div>';
}

function budgetSnapshot(m,s){
  var rows=S.cats.filter(function(c){ return c.group==="spend"; }).map(function(c){
    return {id:c.id,name:c.name,value:Math.abs(s.byCat[c.id]||0),plan:budgetFor(c.id,m)};
  }).filter(function(r){ return r.value>0||r.plan>0; })
    .sort(function(a,b){ return b.value-a.value; }).slice(0,6);
  return '<div class="panel-h"><h2>Budget</h2><span class="sub">top categories · '+ymLabel(m)+'</span>'+
    '<button class="more" data-go="budget" style="margin-left:12px">All →</button></div>'+
    '<div class="bars">'+(rows.length?rows.map(function(r){
      var pct=r.plan>0?r.value/r.plan:null;
      var cls=pct===null?"":pct>1?"over":pct>0.85?"warn":"";
      return '<button class="bar-row" data-go="budget" data-drill="'+esc(r.id)+'" style="padding:9px 0">'+
        '<div class="bar-top"><span class="name">'+esc(r.name)+'</span>'+
        '<span class="vals"><b>'+money(r.value)+'</b>'+(r.plan?' / '+money(r.plan):'')+'</span></div>'+
        '<div class="track thin"><div class="fill '+cls+'" style="width:'+(pct===null?100:Math.min(100,pct*100)).toFixed(1)+'%;'+(pct===null?"background:var(--s6)":"")+'"></div></div>'+
      '</button>';
    }).join(""):'<div class="empty">No spending yet this month.</div>')+'</div>';
}

function cashFlowCard(m){
  var trend=[], si=0, ss=0, n=6;
  for(var i=n-1;i>=0;i--){
    var k=shiftMonth(m,-i), inc=monthIncome(k), sp=monthSpend(k);
    trend.push({label:ymLabel(k),short:MONTH_NAMES[+k.slice(5,7)-1],income:inc,spend:sp});
    si+=inc; ss+=sp;
  }
  return '<div class="panel-h"><h2>Cash flow</h2><span class="sub">last 6 months</span></div>'+
    '<div class="legend"><span><i style="background:var(--s1)"></i>Money in</span><span><i style="background:var(--s2)"></i>Money out</span>'+
      '<span class="muted" style="margin-left:auto">avg net <b class="num" style="color:var(--ink)">'+money((si-ss)/n)+'</b>/mo</span></div>'+
    '<div class="chartbox">'+trendChart(trend)+'<div class="tip"></div></div>';
}

function upcomingCard(){
  var t=todayIso(), lim=isoFromDay(dayNum(t)+30);
  var list=recurringList().filter(function(x){ return x.nextDate&&x.nextDate>=t&&x.nextDate<=lim; })
    .sort(function(a,b){ return a.nextDate<b.nextDate?-1:1; });
  var sum=list.reduce(function(a,x){ return a+x.amount; },0);
  return '<div class="panel-h"><h2>Upcoming</h2><span class="sub">next 30 days'+(list.length?' · '+money(sum):'')+'</span>'+
    '<button class="more" data-go="recurring" style="margin-left:12px">Recurring →</button></div>'+
    '<div class="minilist">'+(list.length?list.slice(0,7).map(function(x){
      return '<div class="minirow"><span class="dt">'+esc(mdDate(x.nextDate))+'</span>'+
        '<span class="ds"><b>'+esc(x.name)+'</b><span class="raw">'+esc(x.cadence.label)+(x.acct?' · '+esc(acctLabel(x.acct)):'')+'</span></span>'+
        '<span class="am">'+money(x.amount,true)+'</span></div>';
    }).join(""):'<div class="empty">Nothing expected in the next 30 days.</div>')+'</div>';
}

function accountsCard(){
  var st=accountStatus();
  return '<div class="panel-h"><h2>Accounts</h2><span class="sub">newest transaction · last import</span>'+
    '<button class="more" data-tab="setup" style="margin-left:12px">Edit →</button></div>'+
    '<div class="bars" style="padding-top:2px">'+(st.length?st.map(acctRow).join(""):'<div class="empty">No accounts set up.</div>')+'</div>';
}
function acctRow(x){
  return '<div class="acctrow">'+bankBadge(x.acct)+
    '<div class="tx"><b>'+esc(x.acct.label)+'</b><span>'+
      (x.latest?'through '+esc(mdDate(x.latest))+' · imported '+esc(ago(x.imported||x.latest))+(x.by?' by '+esc(x.by):''):'nothing imported yet')+
    '</span></div>'+
    (x.stale?'<span class="chip year">due</span>':'<span class="chip ok">current</span>')+
    '<div class="acts">'+downloadBtn(x.acct,false)+
      '<button class="btn sm ghost" data-importacct="'+esc(x.acct.id)+'">Import</button></div>'+
  '</div>';
}

function goalsCard(){
  return '<div class="panel-h"><h2>Goals</h2><button class="more" data-go="goals">All →</button></div>'+
    '<div class="bars">'+(S.goals.length?S.goals.slice(0,5).map(function(g){
      var p=goalProgress(g), pct=g.target>0?Math.min(1,p/g.target):0;
      return '<div class="bar-row" style="padding:9px 0"><div class="bar-top"><span class="name">'+esc(g.name)+'</span>'+
        '<span class="vals"><b>'+money(p)+'</b>'+(g.target?' / '+money(g.target):'')+'</span></div>'+
        '<div class="track thin"><div class="fill good" style="width:'+(pct*100).toFixed(1)+'%"></div></div>'+
        (g.target?'<div class="pct">'+Math.round(pct*100)+'% there</div>':'')+'</div>';
    }).join(""):'<div class="empty">No goals yet. <button class="btn link" data-go="goals">Add one</button></div>')+'</div>';
}

/* ===================== Budget ===================== */

function budgetControls(months){
  var spreadCount=S.recurring.filter(function(r){ return r.spread&&r.active!==false; }).length;
  return '<div class="rowflex">'+
      '<div><label class="fld" for="b-period">Showing</label>'+periodSelect("b-period",S.budPeriod)+'</div>'+
      '<div><label class="fld" for="b-compare">Compare against</label><select id="b-compare">'+
        '<option value="6"'+(S.compare==="6"?" selected":"")+'>6-month average</option>'+
        '<option value="12"'+(S.compare==="12"?" selected":"")+'>12-month average</option>'+
        '<option value="yoy"'+(S.compare==="yoy"?" selected":"")+'>'+(months.length===1?"Same month last year":"Same period last year")+'</option>'+
      '</select></div>'+
      '<div class="narrow"><span class="seg">'+
        '<button data-smooth="1" aria-pressed="'+(S.smooth)+'" title="Annual charges counted across the months they cover">Smoothed</button>'+
        '<button data-smooth="0" aria-pressed="'+(!S.smooth)+'" title="Every charge counted in the month it hit">Cash</button>'+
      '</span></div>'+
    '</div>'+
    (S.smooth&&spreadCount
      ? '<p class="small muted" style="margin:8px 0 0">'+spreadCount+' charge'+(spreadCount===1?" is":"s are")+
        ' spread across the months they cover, so an annual bill doesn\'t spike one month. Switch to Cash for the raw statement view.</p>'
      : "");
}

function viewBudget(){
  var months=periodMonths(S.budPeriod,S.month), range=periodRange(S.budPeriod,S.month);
  var s=summarizeMonths(months,range.from,range.to), n=Math.max(months.length,1), single=months.length===1;
  if(S.drill) return demoBanner()+budgetControls(months)+drillPanel(months,n,single);

  var spendBase=baselineSpend(months);
  var rows=S.cats.filter(function(c){ return c.group==="spend"; }).map(function(c){
    return {id:c.id,name:c.name,value:Math.abs(s.byCat[c.id]||0),
            plan:months.reduce(function(a,k){ return a+budgetFor(c.id,k); },0),
            base:baselineFor(c.id,months)};
  });
  var incRows=S.cats.filter(function(c){ return c.group==="income"; }).map(function(c){
    return {id:c.id,name:c.name,value:s.byCat[c.id]||0};
  }).filter(function(r){ return r.value!==0; }).sort(function(a,b){ return b.value-a.value; });
  var totalSpend=rows.reduce(function(a,r){ return a+r.value; },0);
  var totalPlan=rows.reduce(function(a,r){ return a+r.plan; },0);
  var active=rows.filter(function(r){ return r.value>0||r.plan>0; }).sort(function(a,b){ return (b.value-a.value)||(b.plan-a.plan); });
  var idle=rows.filter(function(r){ return !(r.value>0||r.plan>0); });
  var shown=S.budAll?active.concat(idle):active;
  var left=totalPlan-totalSpend, used=totalPlan>0?totalSpend/totalPlan:0;

  var tiles='<div class="tiles">'+
    '<div class="tile"><div class="k">Income</div><div class="v">'+money(s.income)+'</div>'+
      '<div class="d">'+(n>1?money(s.income/n)+"/mo average":incRows.length+" source"+(incRows.length===1?"":"s"))+'</div></div>'+
    '<div class="tile"><div class="k">Spent</div><div class="v">'+money(totalSpend)+'</div>'+
      '<div class="d">'+(spendBase?vsLine(totalSpend,spendBase,baselineLabel(months),false):(n>1?money(totalSpend/n)+"/mo":"&nbsp;"))+'</div></div>'+
    '<div class="tile"><div class="k">Planned</div><div class="v">'+money(totalPlan)+'</div>'+
      '<div class="d">across '+rows.filter(function(r){ return r.plan>0; }).length+' categories</div></div>'+
    '<div class="tile lead"><div class="k">'+(left<0?"Over plan":"Left to spend")+'</div><div class="v '+(left<0?"neg":"")+'">'+(totalPlan?money(Math.abs(left)):"—")+'</div>'+
      (totalPlan?'<div class="track thin"><div class="fill '+(used>1?"over":used>0.85?"warn":"")+'" style="width:'+Math.min(100,used*100).toFixed(1)+'%"></div></div>':'')+
      '<div class="d">'+(totalPlan?Math.round(used*100)+"% of the plan used":"set a plan below")+'</div></div>'+
  '</div>';

  var maxBar=Math.max.apply(null,[1].concat(shown.map(function(b){ return Math.max(b.value,b.plan); })));
  var table='<section class="panel"><div class="tablewrap"><table class="btable" style="min-width:0">'+
    '<thead><tr><th>Category</th><th class="hide-s" style="width:26%"></th><th class="r">Spent</th><th class="r">'+(single?"Budget":"Plan")+'</th><th class="r hide-s">Remaining</th></tr></thead><tbody>'+
    '<tr class="grp"><td>Expenses</td><td class="hide-s"></td><td class="r num">'+money(totalSpend)+'</td><td class="r num">'+money(totalPlan)+'</td><td class="r num hide-s">'+(totalPlan?money(left):"")+'</td></tr>'+
    (shown.length?shown.map(function(b){
      var pct=b.plan>0?(b.value/b.plan):null;
      var cls=pct===null?"":pct>1?"over":pct>0.85?"warn":"";
      var w=Math.min(100,(b.value/maxBar)*100), pin=b.plan>0?Math.min(100,(b.plan/maxBar)*100):null;
      var bar='<div class="track"><div class="fill '+cls+'" style="width:'+w.toFixed(1)+'%"></div>'+(pin!==null?'<div class="pin" style="left:'+pin.toFixed(1)+'%"></div>':'')+'</div>';
      return '<tr><td><button class="cname" data-drill="'+esc(b.id)+'">'+esc(b.name)+'</button>'+
          '<div class="show-s">'+bar+'</div>'+
          '<div class="meta">'+
            (totalSpend&&b.value?'<span>'+Math.round((b.value/totalSpend)*100)+'% of spend</span>':'')+
            (pct!==null?'<span>'+Math.round(pct*100)+'% used</span>':'')+
            (n>1&&b.value?'<span>'+money(b.value/n)+'/mo</span>':'')+
            (b.value||b.base?deltaChip(b.value,b.base,months):'')+
          '</div></td>'+
        '<td class="hide-s">'+bar+'</td>'+
        '<td class="r num">'+(b.value?money(b.value):'<span class="muted">—</span>')+'</td>'+
        '<td class="r">'+(single&&!isDemo()
          ? '<input type="number" min="0" step="10" class="bin num" value="'+(b.plan||"")+'" placeholder="0" data-budget="'+b.id+'">'+
            '<span class="carry">'+(hasOverrideAt(b.id,S.month)?'set this month · <button data-budgetclear="'+b.id+'">undo</button>':'carried forward')+'</span>'
          : '<span class="num">'+(b.plan?money(b.plan):'<span class="muted">—</span>')+'</span>')+'</td>'+
        '<td class="r num hide-s '+(b.plan&&b.plan-b.value<0?"neg":"")+'">'+(b.plan?money(b.plan-b.value):'<span class="muted">—</span>')+'</td></tr>';
    }).join(""):'<tr><td colspan="5"><div class="empty">No spending recorded for '+periodLabel(S.budPeriod,S.month)+'.</div></td></tr>')+
    (idle.length?'<tr><td colspan="5" style="padding:8px 12px"><button class="btn ghost sm" id="bud-all">'+
      (S.budAll?"Hide unused categories":"Show "+idle.length+" unused categor"+(idle.length===1?"y":"ies")+(single?" to plan for":""))+'</button></td></tr>':'')+
    '<tr class="grp"><td>Income</td><td class="hide-s"></td><td class="r num">'+money(s.income)+'</td><td></td><td class="hide-s"></td></tr>'+
    (incRows.length?incRows.map(function(r){
      return '<tr><td><button class="cname" data-drill="'+esc(r.id)+'">'+esc(r.name)+'</button></td><td class="hide-s"></td>'+
        '<td class="r num pos">'+money(r.value)+'</td><td></td><td class="hide-s"></td></tr>';
    }).join(""):'<tr><td colspan="5" class="small muted">No income recorded for this period.</td></tr>')+
  '</tbody></table></div></section>';

  var don=foldSlices(rows.map(function(r){ return {id:r.id,name:r.name,value:S.donut==="plan"?r.plan:r.value}; }));
  var side='<section class="panel"><div class="panel-h"><h2>Breakdown</h2><span class="sub"><span class="seg">'+
      '<button data-donut="share" aria-pressed="'+(S.donut==="share")+'">Spent</button>'+
      '<button data-donut="plan" aria-pressed="'+(S.donut==="plan")+'">Plan</button></span></span></div>'+
    (don.slices.length
      ? '<div class="donutwrap"><div class="chartbox" style="padding:0;overflow:visible">'+donutChart(don.slices,don.total,"drill",S.donut==="plan"?"planned":"spent")+'<div class="tip"></div></div>'+
        '<div class="dlegend">'+don.slices.map(function(sl){
          return '<button'+(sl.isOther?' id="bud-all-show"':' data-drill="'+esc(sl.id)+'"')+'>'+
            '<i style="background:'+sl.color+'"></i><span class="nm">'+esc(sl.name)+'</span>'+
            '<span class="vv">'+money(sl.value)+'</span><span class="pp">'+Math.round(sl.pct*100)+'%</span></button>';
        }).join("")+'</div></div>'
      : '<div class="empty">'+(S.donut==="plan"?"No plan set yet.":"Nothing spent in this period.")+'</div>')+
  '</section>'+
  '<section class="panel" style="margin-top:16px;padding:16px">'+
    '<div class="kicker">Planning</div>'+
    '<p class="small" style="color:var(--ink-2);margin:8px 0 0">A budget you set applies to that month <b>and every month after it</b>, until you set a different one. Set it once; only touch it for the odd month — a bigger December, say.</p>'+
    (single&&!isDemo()?'<div style="margin-top:12px"><button class="btn primary" id="wiz-open">Build a plan from history…</button></div>':
      '<p class="small muted" style="margin:10px 0 0">Pick a single month to edit budgets.</p>')+
  '</section>';

  return demoBanner()+budgetControls(months)+tiles+
    (S.wizard?wizardPanel(S.cats.filter(function(c){ return c.group==="spend"; })):"")+
    '<div class="grid side-r"><div>'+table+historyPanel()+'</div><div>'+side+'</div></div>';
}

function historyPanel(){
  var spend=S.cats.filter(function(c){ return c.group==="spend"; });
  if(!S.trendCat||!catById(S.trendCat)){
    var biggest=spend.slice().sort(function(a,b){ return Math.abs(monthCat(S.month,b.id))-Math.abs(monthCat(S.month,a.id)); })[0];
    S.trendCat=biggest?biggest.id:"";
  }
  var hist=S.trendCat?categoryHistory(S.trendCat,S.month,12):null;
  var histAvg=hist?hist.months.reduce(function(a,m){ return a+m.actual; },0)/hist.months.length:0;
  return '<section class="panel" style="margin-top:16px">'+
    '<div class="panel-h"><h2>Over time</h2><select id="trendcat" style="max-width:220px;width:auto">'+spend.map(function(c){
        return '<option value="'+c.id+'"'+(S.trendCat===c.id?" selected":"")+'>'+esc(c.name)+'</option>';
      }).join("")+'</select>'+
      '<span class="sub">12 months to '+ymLabel(S.month)+' · averaging '+money(histAvg)+'/mo</span></div>'+
    '<div class="legend"><span><i style="background:var(--accent)"></i>Spent</span>'+
      '<span><i style="background:var(--crit)"></i>Over plan</span>'+
      '<span><i class="ln" style="background:var(--ink-2)"></i>Plan in force (a step is a month you changed it)</span></div>'+
    '<div class="chartbox">'+(hist?hist.svg:'<div class="empty">No spending categories yet.</div>')+'<div class="tip"></div></div>'+
  '</section>';
}

function drillPanel(months,n,single){
  var range=periodRange(S.budPeriod,S.month);
  var cat=catById(S.drill);
  var income=cat&&cat.group==="income";
  var mer=merchantsIn(S.drill,months);
  if(income){
    var mm={};
    allTxns().forEach(function(t){
      if(t.cat!==S.drill||t.date<range.from||t.date>range.to) return;
      var k=merchantKey(t.desc); mm[k]=(mm[k]||0)+t.amount;
    });
    mer=Object.keys(mm).map(function(k){ return {key:k,name:keyName(k),value:mm[k]}; }).sort(function(a,b){ return b.value-a.value; });
  }
  var total=mer.reduce(function(a,m){ return a+m.value; },0);
  var list=allTxns().filter(function(t){
    return t.cat===S.drill && t.date>=range.from && t.date<=range.to &&
      (!S.drillMerch || merchantKey(t.desc)===S.drillMerch);
  }).sort(function(a,b){ return a.date<b.date?1:-1; });
  var maxV=Math.max.apply(null,[1].concat(mer.map(function(m){ return m.value; })));
  var base=income?0:baselineFor(S.drill,months);
  var plan=months.reduce(function(a,k){ return a+budgetFor(S.drill,k); },0);
  var hist=income?null:categoryHistory(S.drill,S.month,12);

function wizardPanel(spend){
  var w=S.wizard, end=shiftMonth(S.month,-1);
  var rows=spend.map(function(c){
    var vals=[];
    for(var i=0;i<w.basis;i++) vals.push(Math.abs(monthCat(shiftMonth(end,-i),c.id)));
    var v=w.method==="median"?median(vals):vals.reduce(function(a,b){ return a+b; },0)/w.basis;
    var rounded=Math.round(v/w.round)*w.round;
    return {id:c.id,name:c.name,now:budgetFor(c.id,S.month),suggest:rounded};
  }).filter(function(r){ return r.suggest>0||r.now>0; });
  var sum=rows.reduce(function(a,r){ return a+r.suggest; },0);

  return '<section class="panel" style="margin-top:16px;padding:16px">'+
    '<div class="kicker">Build a plan from history</div>'+
    '<div class="rowflex">'+
      '<div><label class="fld" for="wiz-basis">Based on</label><select id="wiz-basis">'+
        [3,6,12].map(function(n){ return '<option value="'+n+'"'+(w.basis===n?" selected":"")+'>last '+n+' months</option>'; }).join("")+'</select></div>'+
      '<div><label class="fld" for="wiz-method">Using</label><select id="wiz-method">'+
        '<option value="avg"'+(w.method==="avg"?" selected":"")+'>the average</option>'+
        '<option value="median"'+(w.method==="median"?" selected":"")+'>the median (ignores one-offs)</option></select></div>'+
      '<div><label class="fld" for="wiz-round">Rounded to</label><select id="wiz-round">'+
        [5,10,25,50].map(function(n){ return '<option value="'+n+'"'+(w.round===n?" selected":"")+'>nearest $'+n+'</option>'; }).join("")+'</select></div>'+
    '</div>'+
    '<p class="small muted" style="margin-top:10px">Months counted end with '+ymLabel(end)+
      ', so the month you\'re part-way through doesn\'t drag the numbers down. Applying sets these for '+ymLabel(S.month)+
      ' onward — earlier months keep whatever they had.</p>'+
    '<div class="rowlist"><div class="tablewrap"><table>'+
      '<thead><tr><th>Category</th><th class="r">Plan now</th><th class="r">Suggested</th><th class="r">Change</th></tr></thead><tbody>'+
      rows.map(function(r){
        var d=r.suggest-r.now;
        return '<tr><td>'+esc(r.name)+'</td><td class="r num muted">'+(r.now?money(r.now):"—")+'</td>'+
          '<td class="r num"><b>'+money(r.suggest)+'</b></td>'+
          '<td class="r num '+(d>0?"neg":"")+'">'+(r.now?(d===0?"—":(d>0?"+":"−")+money(Math.abs(d)).replace("−","")):"new")+'</td></tr>';
      }).join("")+
    '</tbody></table></div></div>'+
    '<div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
      '<button class="btn primary" id="wiz-apply">Apply '+rows.length+' budgets · '+money(sum)+'/mo</button>'+
      '<button class="btn ghost" id="wiz-close">Cancel</button></div>'+
  '</section>';
}

/* Write one entry's settings back, keeping every other entry as it was. */
function upsertRecurring(key,patch){
  var found=false;
  S.recurring=S.recurring.map(function(r){
    if(r.key!==key) return r;
    found=true;
    return Object.assign({},r,patch);
  });
  if(!found){
    // First edit to a detected entry: keep what detection worked out, so ticking
    // "spread" doesn't silently reset a yearly charge to monthly.
    var seed={key:key,label:"",cat:"",cadence:"month",amount:0,spread:false,source:"auto",active:true};
    var all=recurringList();
    for(var i=0;i<all.length;i++){
      if(all[i].key!==key) continue;
      seed.cat=all[i].cat||"";
      seed.cadence=all[i].cadence.per;
      seed.amount=all[i].amount||0;
    }
    S.recurring.push(Object.assign(seed,patch));
  }
  render();
  push("saveRecurring",S.recurring,null);
}

function viewRecurring(){
  var subs=recurringList();
  var monthly=subs.reduce(function(a,s){ return a+s.perMonth; },0);
  var byCat={};
  subs.forEach(function(s){ (byCat[s.cat]=byCat[s.cat]||[]).push(s); });
  var order=Object.keys(byCat).sort(function(a,b){
    var sa=byCat[a].reduce(function(x,s){ return x+s.perMonth; },0);
    var sb=byCat[b].reduce(function(x,s){ return x+s.perMonth; },0);
    return sb-sa;
  });
  var months=[];
  for(var i=11;i>=0;i--) months.push(shiftMonth(S.month,-i));
  var changed=subs.filter(function(s){ return s.changed; });
  var soon=subs.filter(function(s){ return s.cadence.per==="year"&&s.nextDate&&s.nextDate<=isoFromDay(dayNum(todayIso())+45); });

  var spreadSum=subs.filter(function(s){ return s.spread; })
    .reduce(function(a,s){ return a+s.perMonth; },0);
  var subCatIds={};
  S.cats.forEach(function(c){ if(/subscription|streaming|membership/i.test(c.name)) subCatIds[c.id]=1; });
  var subsOnly=subs.filter(function(s){ return subCatIds[s.cat]; });

  return '<p class="intro">Charges that repeat on a steady rhythm. The app finds them; you have the last word — rename, re-file, change the cadence, or drop one that isn\'t really a subscription.</p>'+
  '<div class="tiles">'+
    '<div class="tile lead"><div class="k">Per month</div><div class="v">'+money(monthly)+'</div>'+
      '<div class="d">'+subs.length+' recurring charge'+(subs.length===1?"":"s")+'</div></div>'+
    '<div class="tile"><div class="k">Per year</div><div class="v">'+money(monthly*12)+'</div>'+
      '<div class="d">at the current rate</div></div>'+
    '<div class="tile"><div class="k">Spread</div><div class="v">'+money(spreadSum)+'</div>'+
      '<div class="d">per month, from charges paid in lumps</div></div>'+
    '<div class="tile"><div class="k">Price changes</div><div class="v '+(changed.length?"neg":"")+'">'+changed.length+'</div>'+
      '<div class="d">latest charge differs from usual</div></div>'+
    '<div class="tile"><div class="k">Renewals</div><div class="v">'+soon.length+'</div>'+
      '<div class="d">annual, due in 45 days</div></div>'+
  '</div>'+

  (isDemo()?'':'<div style="margin-top:14px"><button class="btn" id="rec-add-open">Add one by hand…</button></div>')+
  (S.recNew?recAddPanel():"")+

  (subsOnly.length
    ? recSection("Subscriptions",subsOnly,months,
        "Everything filed under a subscription category, with the card it lands on.")
    : "")+
  (subs.length
    ? order.filter(function(cid){ return !subCatIds[cid]; })
        .map(function(cid){ return recSection(catName(cid)||"Uncategorized",byCat[cid],months,""); }).join("")
    : '<section class="panel" style="margin-top:14px"><div class="empty">Nothing detected yet — it needs a few months of history before a rhythm is visible. You can add one by hand above.</div></section>')+

  '<p class="small muted" style="margin-top:14px">'+
    '<b>What spreading does:</b> a charge you pay once a year is counted as a twelfth of itself in each of the twelve months it covers, so an annual bill doesn’t make one month look catastrophic and the other eleven look cheap. Transactions always shows the real charge on the real day; only the analysis is smoothed, and Budget has a Cash toggle for the raw view. '+
    'Marks are the last 12 months; amber means the charge covers more than one month. Detection needs three repeats, or two when the gap is six months or a year.</p>';
}

function recSection(title,list,months,blurb){
  var sum=list.reduce(function(a,s){ return a+s.perMonth; },0);
  return '<section class="panel" style="margin-top:16px">'+
    '<div class="panel-h"><h2>'+esc(title)+'</h2>'+
      '<span class="sub num">'+money(sum)+'/mo · '+money(sum*12)+'/yr</span></div>'+
    (blurb?'<div class="legend"><span class="muted">'+esc(blurb)+'</span></div>':'')+
    '<div class="bars">'+list.map(function(s){ return recRow(s,months); }).join("")+'</div></section>';
}

function recRow(s,months){
  var strip=months.map(function(k){
    var hit=s.rows.some(function(r){ return r.date.slice(0,7)===k; });
    return '<i class="'+(hit?(s.cadence.months>1?"big":"on"):"")+'" title="'+ymLabel(k)+'"></i>';
  }).join("");
  var demo=isDemo();
  return '<div class="bar-row">'+
    '<div class="bar-top">'+
      '<span class="name" style="flex:1 1 160px;min-width:0">'+
        (demo?'<b>'+esc(s.name)+'</b>':'<input type="text" value="'+esc(s.name)+'" data-reclabel="'+esc(s.key)+'" style="max-width:240px;padding:4px 8px;font-size:13.5px;font-weight:600">')+
      '</span>'+
      (s.cadence.months>1?'<span class="chip year">paid '+esc(s.cadence.label)+'</span>':'')+
      (s.spread?'<span class="chip info">spread</span>':'')+
      (s.changed?'<span class="chip up">was '+money(s.was)+'</span>':'')+
      (s.manualOnly?'<span class="chip flag">added by hand</span>':'')+
      '<span class="vals"><b>'+money(s.amount,true)+'</b> '+esc(s.cadence.label)+'</span></div>'+
    '<div class="strip">'+strip+'</div>'+
    '<div class="pct">'+
      '<span>'+money(s.perMonth)+'/mo equivalent</span>'+
      '<span>'+money(s.perMonth*12)+'/yr</span>'+
      (s.acct?'<span>charged to '+esc(acctLabel(s.acct))+'</span>':'')+
      (s.lastDate?'<span>last '+esc(mdDate(s.lastDate))+'</span>':'')+
      (s.nextDate?'<span>next around '+esc(mdDate(s.nextDate))+'</span>':'')+
      '<span>'+s.count+' seen</span>'+
    '</div>'+
    (demo?'':
    '<div class="pct" style="margin-top:8px">'+
      '<select data-reccad="'+esc(s.key)+'" style="width:auto;padding:3px 7px;font-size:12.5px">'+
        CADENCES.map(function(c){ return '<option value="'+c.per+'"'+(s.cadence.per===c.per?" selected":"")+'>'+esc(c.label)+'</option>'; }).join("")+
      '</select>'+
      '<select data-reccat="'+esc(s.key)+'" style="width:auto;padding:3px 7px;font-size:12.5px">'+
        catOptions(s.cat,function(c){ return c.group==="spend"; })+
      '</select>'+
      '<input type="number" step="0.01" data-recamt="'+esc(s.key)+'" value="'+s.amount.toFixed(2)+'" '+
        'style="width:96px;padding:3px 7px;font-size:12.5px" class="num" title="What the budget should use">'+
      '<label style="display:inline-flex;gap:6px;align-items:center">'+
        '<input type="checkbox" data-recspread="'+esc(s.key)+'"'+(s.spread?" checked":"")+' style="width:auto">'+
        'spread across '+(s.cadence.months>1?"its "+s.cadence.months+" months":"the month")+
      '</label>'+
      (S.recDrop===s.key
        ? '<button class="btn sm danger" data-recdel="'+esc(s.key)+'">Remove it?</button>'+
          '<button class="btn ghost sm" id="rec-drop-cancel">No</button>'
        : '<button class="btn ghost sm danger" data-recdrop="'+esc(s.key)+'">Remove</button>')+
    '</div>')+
  '</div>';
}

  var matches=merchantRoster().filter(function(m){
    if(!q) return false;
    return m.key.indexOf(q)!==-1||keyName(m.key).toLowerCase().indexOf(q)!==-1;

    (q&&!n.key
      ? (matches.length

                '<b>'+esc(keyName(m.key))+'</b> · '+m.n+' charges · '+money(m.total)+' total'+

      : "")+

    (n.key
      ? '<div class="banner" style="margin-top:10px"><span><b>'+esc(keyName(n.key))+'</b>'+
          (p?' · '+p.n+' charge'+(p.n===1?"":"s")+' on record · last '+esc(p.lastDate)+' from '+esc(acctLabel(p.acct)):' · nothing on record yet')+
        '</span><button class="btn sm" id="rec-unpick">Change</button></div>'
      : "")+

    (p&&p.distinct>1
      ? '<div class="small muted" style="margin-top:10px">It has been '+p.distinct+' different amounts. Which should the budget use?</div>'+
        '<div class="catgrid" style="margin-top:6px">'+
          ['latest','avg','median'].map(function(kind){
            var v=p[kind], lbl={latest:"Latest charge",avg:"Average",median:"Median"}[kind];
            return '<button data-recprice="'+kind+'" data-val="'+v.toFixed(2)+'" class="'+
              (Math.abs((n.amount||0)-v)<0.005?"on":"")+'">'+esc(lbl)+' · '+money(v,true)+'</button>';

    '<div class="rowflex">'+
      '<div><label class="fld" for="rec-label">Call it</label><input type="text" id="rec-label" value="'+esc(n.label)+'" placeholder="'+esc(n.key?keyName(n.key):"Netflix")+'"></div>'+
      '<div><label class="fld" for="rec-cat">Category</label><select id="rec-cat">'+
        catOptions(n.cat,function(c){ return c.group==="spend"; })+'</select></div>'+
      '<div><label class="fld" for="rec-cad">Every</label><select id="rec-cad">'+
        CADENCES.map(function(c){ return '<option value="'+c.per+'"'+(n.cadence===c.per?" selected":"")+'>'+esc(c.label)+'</option>'; }).join("")+'</select></div>'+
      '<div><label class="fld" for="rec-amt">Amount</label><input type="number" id="rec-amt" step="0.01" value="'+(n.amount||"")+'" placeholder="0.00" class="num"></div>'+
    '</div>'+
    '<label class="remember"><input type="checkbox" id="rec-spread"'+(n.spread?" checked":"")+'> Spread it across the months it covers</label>'+
    '<div style="margin-top:12px;display:flex;gap:8px">'+
      '<button class="btn primary" id="rec-add-save">Add it</button>'+
      '<button class="btn ghost" id="rec-add-close">Cancel</button></div>'+

}

/* ===================== Insights ===================== */

function viewInsights(){
  var i=S.ins;
  var months=periodMonths(i.period,S.month);
  var range=periodRange(i.period,S.month);
  var s=summarizeMonths(months,range.from,range.to);
  var n=Math.max(months.length,1);
  var base=insBaseSpend(months);

  var head=demoBanner()+'<p class="intro">Start wide, then click into anything. Every number here answers to the period and the comparison you pick.</p>'+
  '<div class="rowflex">'+
    '<div><label class="fld" for="i-period">Period</label>'+periodSelect("i-period",i.period)+'</div>'+
    (i.period==="custom"
      ? '<div style="flex:1 1 280px"><label class="fld">Dates</label><div class="daterow">'+
          '<input type="date" id="i-from" value="'+esc(range.from)+'" style="flex:1 1 130px">'+
          '<input type="date" id="i-to" value="'+esc(range.to)+'" style="flex:1 1 130px"></div></div>'
      : "")+
    '<div><label class="fld" for="i-compare">Compare with</label><select id="i-compare">'+
      '<option value="prev"'+(i.compare==="prev"?" selected":"")+'>The period before</option>'+
      '<option value="yoy"'+(i.compare==="yoy"?" selected":"")+'>The same period last year</option>'+
      '<option value="6"'+(i.compare==="6"?" selected":"")+'>6-month average</option>'+
      '<option value="12"'+(i.compare==="12"?" selected":"")+'>12-month average</option>'+
    '</select></div>'+
    '<div class="narrow"><span class="seg">'+
      [['overview','Overview'],['trends','Trends'],['findings','Findings']].map(function(v){
        return '<button data-insview="'+v[0]+'" aria-pressed="'+(i.view===v[0])+'">'+v[1]+'</button>';
      }).join("")+
    '</span></div>'+
  '</div>'+
  '<div class="tiles">'+
    '<div class="tile lead"><div class="k">Spent</div><div class="v">'+money(s.spend)+'</div>'+
      '<div class="d">'+periodLabel(i.period,S.month)+(n>1?" · "+n+" months":"")+'</div></div>'+
    '<div class="tile"><div class="k">Per month</div><div class="v">'+money(s.spend/n)+'</div>'+
      '<div class="d">'+((base&&insBaseCoverage(months)>=0.6)
        ?((s.spend>base?"+":"−")+money(Math.abs(s.spend-base)/n).replace("−","")+"/mo vs "+insBaseLabel(months))
        :"not enough history to compare")+'</div></div>'+
    '<div class="tile"><div class="k">Money in</div><div class="v">'+money(s.income)+'</div>'+
      '<div class="d">'+money(s.income/n)+'/mo</div></div>'+
    '<div class="tile"><div class="k">Net</div><div class="v '+(s.net<0?"neg":"")+'">'+money(s.net)+'</div>'+
      '<div class="d">'+(s.income>0?Math.round((s.net/s.income)*100)+"% of what came in":"—")+'</div></div>'+
  '</div>';

  if(i.cat) return head+insDetail(months,range,n);

  var rows=S.cats.filter(function(c){ return c.group==="spend"; }).map(function(c){
    return {id:c.id,name:c.name,value:Math.abs(s.byCat[c.id]||0),
            plan:months.reduce(function(a,k){ return a+budgetFor(c.id,k); },0),
            base:insBaseCat(c.id,months)};
  }).filter(function(r){ return r.value>0||r.plan>0; })
    .sort(function(a,b){ return b.value-a.value; });
  var total=rows.reduce(function(a,r){ return a+r.value; },0);

  if(i.view==="trends"){
    var hist={},maxV=0;
    rows.forEach(function(r){
      var vals=[],over=[];
      for(var j=11;j>=0;j--){
        var k=shiftMonth(S.month,-j), v=Math.abs(monthCat(k,r.id)), b=budgetFor(r.id,k);
        vals.push(v); over.push(b>0&&v>b);
        if(v>maxV) maxV=v;
      }
      hist[r.id]={vals:vals,over:over};
    });
    return head+'<section class="panel" style="margin-top:16px">'+
      '<div class="panel-h"><h2>Twelve months, every category</h2>'+
        '<span class="sub">same scale throughout · red bars are over plan</span></div>'+
      '<div class="smgrid">'+rows.map(function(r){
        var h=hist[r.id];
        return '<button class="smc" data-inscat="'+esc(r.id)+'">'+
          '<div class="nm">'+esc(r.name)+'</div>'+
          '<div class="vv">'+money(r.value)+'</div>'+
          '<div class="sub">'+money(r.value/n)+'/mo'+(total?" · "+Math.round((r.value/total)*100)+"%":"")+'</div>'+
          sparkBars(h.vals,maxV,h.over)+'</button>';
      }).join("")+'</div></section>'+
      '<p class="small muted" style="margin-top:10px">Every panel shares one vertical scale, so a tall bar is tall everywhere — that’s what makes the small ones readable as small.</p>';
  }

  if(i.view==="findings") return head+findingsPanel(months,range,rows,total,s);

  return head+
    '<section class="panel" style="margin-top:16px">'+
      '<div class="panel-h"><h2>Where the money is</h2>'+
        '<span class="sub">area is share of '+money(total)+' · click to open one</span></div>'+
      '<div class="chartbox">'+treemapSVG(rows.map(function(r){
        return {id:r.id,name:r.name,value:r.value}; }).filter(function(r){ return r.value>0; }),total)+'<div class="tip"></div></div>'+
    '</section>'+
    '<section class="panel" style="margin-top:16px"><div class="tablewrap"><table>'+
      '<thead><tr><th>Category</th><th class="r">Total</th><th class="r">Per month</th>'+
      '<th class="r">Share</th><th class="r">Plan</th><th>Vs '+esc(insBaseLabel(months))+'</th></tr></thead><tbody>'+
      rows.map(function(r){
        var pct=r.plan>0?(r.value/r.plan):null;
        return '<tr><td><button class="link" data-inscat="'+esc(r.id)+'">'+esc(r.name)+'</button></td>'+
          '<td class="r num"><b>'+money(r.value)+'</b></td>'+
          '<td class="r num">'+money(r.value/n)+'</td>'+
          '<td class="r num muted">'+(total?Math.round((r.value/total)*100)+"%":"—")+'</td>'+
          '<td class="r num '+(pct!==null&&pct>1?"neg":"")+'">'+(r.plan?Math.round(pct*100)+"% of "+money(r.plan):'<span class="muted">—</span>')+'</td>'+
          '<td>'+insDelta(r.value,r.base,months)+'</td></tr>';
      }).join("")+
    '</tbody></table></div></section>';
}

function insDetail(months,range,n){
  var id=S.ins.cat, c=catById(id);
  var val=months.reduce(function(a,k){ return a+Math.abs(monthCat(k,id)); },0);
  var plan=months.reduce(function(a,k){ return a+budgetFor(id,k); },0);
  var base=insBaseCat(id,months);
  var hist=categoryHistory(id,S.month,24);
  var mer=merchantsIn(id,months);
  var maxM=Math.max.apply(null,[1].concat(mer.map(function(m){ return m.value; })));
  var list=allTxns().filter(function(t){ return t.cat===id&&t.date>=range.from&&t.date<=range.to; })
    .sort(function(a,b){ return a.date<b.date?1:-1; });

  return '<section class="panel" style="margin-top:16px">'+
    '<div class="panel-h"><h2><button class="btn ghost sm" id="ins-back">← All categories</button>'+esc(c?c.name:"—")+'</h2>'+
      '<span class="sub num">'+money(val)+' · '+money(val/n)+'/mo'+(plan?' · '+Math.round((val/plan)*100)+'% of plan':'')+'</span></div>'+
    '<div class="legend"><span>'+insDelta(val,base,months)+'</span>'+
      '<span class="muted">'+mer.length+' merchant'+(mer.length===1?"":"s")+' · '+list.length+' transactions</span></div>'+
    '<div class="legend"><span><i style="background:var(--accent)"></i>Spent</span>'+
      '<span><i style="background:var(--crit)"></i>Over plan</span>'+
      '<span><i class="ln" style="background:var(--ink-2)"></i>Plan</span></div>'+
    '<div class="chartbox">'+hist.svg+'<div class="tip"></div></div>'+
  '</section>'+
  '<div class="grid two">'+
    '<section class="panel"><div class="panel-h"><h2>Who it went to</h2></div>'+
      '<div class="bars">'+(mer.length?mer.slice(0,14).map(function(m){
            return '<div class="bar-row" style="padding:8px 0"><div class="bar-top">'+
              '<span class="name">'+esc(m.name)+'</span>'+
              '<span class="vals"><b>'+money(m.value)+'</b> · '+money(m.value/n)+'/mo</span></div>'+
              '<div class="track thin"><div class="fill" style="width:'+Math.min(100,(m.value/maxM)*100).toFixed(1)+'%"></div></div></div>';
          }).join(""):'<div class="empty">Nothing in this category for the period.</div>')+'</div>'+
    '</section>'+
    '<section class="panel"><div class="panel-h"><h2>Transactions</h2>'+
      '<span class="sub">'+periodLabel(S.ins.period,S.month)+'</span></div>'+
      miniTxnList(list,18)+'</section>'+
  '</div>';
}

/* Observations, not advice — arithmetic on his own numbers. */
function findingsPanel(months,range,rows,total,s){
  var n=Math.max(months.length,1);
  var thin=insBaseCoverage(months)<0.6;
  var movers=thin?[]:rows.map(function(r){ return {r:r,d:r.value-r.base}; })
    .filter(function(x){ return x.r.base>0||x.r.value>0; });
  var up=movers.filter(function(x){ return x.d>0; }).sort(function(a,b){ return b.d-a.d; }).slice(0,5);
  var down=movers.filter(function(x){ return x.d<0; }).sort(function(a,b){ return a.d-b.d; }).slice(0,5);
  var over=rows.filter(function(r){ return r.plan>0&&r.value>r.plan; })
    .sort(function(a,b){ return (b.value-b.plan)-(a.value-a.plan); }).slice(0,6);

  var firstSeen={};
  allTxns().forEach(function(t){
    var k=merchantKey(t.desc); if(!k) return;
    if(!firstSeen[k]||t.date<firstSeen[k]) firstSeen[k]=t.date;
  });
  var fresh={};
  allTxns().forEach(function(t){
    if(t.date<range.from||t.date>range.to||t.amount>=0) return;
    var k=merchantKey(t.desc);
    if(firstSeen[k]>=range.from) fresh[k]=(fresh[k]||0)+(-t.amount);
  });
  var newOnes=Object.keys(fresh).map(function(k){ return {key:k,name:keyName(k),value:fresh[k]}; })
    .sort(function(a,b){ return b.value-a.value; }).slice(0,6);

  var recs=recurringList();
  var risen=recs.filter(function(x){ return x.changed&&x.amount>x.was; })
    .sort(function(a,b){ return (b.amount-b.was)-(a.amount-a.was); }).slice(0,5);
  var recMonthly=recs.reduce(function(a,x){ return a+x.perMonth; },0);

  var big=allTxns().filter(function(t){ return t.date>=range.from&&t.date<=range.to&&t.amount<0; })
    .sort(function(a,b){ return a.amount-b.amount; }).slice(0,6);

  var trim=rows.filter(function(r){ return r.value>0; }).slice(0,5);
  var trimBase=trim.reduce(function(a,r){ return a+r.value; },0)/n;

  function card(cls,title,bigv,p,items){
    return '<div class="find '+cls+'"><h3>'+title+'</h3>'+
      (bigv?'<div class="big">'+bigv+'</div>':'')+
      (p?'<p>'+p+'</p>':'')+
      (items&&items.length?'<ul>'+items.join("")+'</ul>':'')+'</div>';
  }
  function li(name,amt,cat){
    return '<li><span class="nm">'+(cat?'<button class="link" data-inscat="'+esc(cat)+'">'+esc(name)+'</button>':esc(name))+'</span>'+
      '<span class="amt">'+amt+'</span></li>';
  }

  var cards=[];
  if(thin) cards.push(card("","Not enough history yet","","There is too little in "+esc(insBaseLabel(months))+
    " to compare this period against. Pick a shorter period, or a different comparison, and the movers appear.",[]));
  if(up.length) cards.push(card("crit","Biggest rises","",
    "Against "+esc(insBaseLabel(months))+".",
    up.map(function(x){ return li(x.r.name,"+"+money(x.d).replace("−",""),x.r.id); })));
  if(down.length) cards.push(card("good","Biggest falls","",
    "Against "+esc(insBaseLabel(months))+".",
    down.map(function(x){ return li(x.r.name,"−"+money(-x.d).replace("−",""),x.r.id); })));
  if(over.length) cards.push(card("warn","Over plan",money(over.reduce(function(a,r){ return a+(r.value-r.plan); },0))+" over",
    over.length+" categor"+(over.length===1?"y":"ies")+" spent more than planned.",
    over.map(function(r){ return li(r.name,"+"+money(r.value-r.plan).replace("−",""),r.id); })));

        '<div class="namegrid">'+cats.map(function(c){

/* Every raw description that has landed under this merchant. */
function variationsOf(key){
  var m={};
  allTxns().forEach(function(t){
    if(merchantKey(t.desc)!==key) return;
    var d=String(t.desc).trim();
    m[d]=(m[d]||0)+1;
  });
  return Object.keys(m).map(function(d){ return {desc:d,n:m[d]}; })
    .sort(function(a,b){ return b.n-a.n; });
}

/* Shorter prefixes of this merchant's key that would sweep other merchants in with
   it — how "Amazon Com Rt" and "Amazon Com Qa" become one "Amazon". */
function mergeOptions(key){
  var words=key.split(" "), all=merchantRoster(), out=[];
  for(var i=1;i<words.length;i++){
    var pre=words.slice(0,i).join(" ");
    var hits=all.filter(function(m){ return m.key===pre||m.key.indexOf(pre+" ")===0; });
    if(hits.length>1){
      out.push({prefix:pre,n:hits.length,
                total:hits.reduce(function(a,m){ return a+m.total; },0),
                seen:hits.reduce(function(a,m){ return a+m.n; },0)});
    }
  }
  return out;
}

/* Narrow the merchant list down by any column, and sort by any of them. */
function filterRoster(roster){
  var f=S.mFilter, out=roster;
  if(f.q){
    var q=f.q.toLowerCase();
    out=out.filter(function(m){
      return m.key.indexOf(q)!==-1 || merchNick(m.key).toLowerCase().indexOf(q)!==-1;
    });
  }
  if(f.cat==="__none__")       out=out.filter(function(m){ return !m.cats.length&&!m.cat; });
  else if(f.cat==="__multi__") out=out.filter(function(m){ return m.cats.length>1; });
  else if(f.cat==="__mixed__") out=out.filter(function(m){ return m.nCats>1&&m.cats.length<2; });
  else if(f.cat==="__named__") out=out.filter(function(m){ return !!merchNick(m.key); });
  else if(f.cat==="__unnamed__") out=out.filter(function(m){ return !merchNick(m.key); });
  else if(f.cat) out=out.filter(function(m){
    return m.cats.indexOf(f.cat)!==-1 || (!m.cats.length&&m.cat===f.cat);
  });

  var k=f.sort, dir=f.dir;
  return out.slice().sort(function(a,b){
    var x,y;
    if(k==="key"){ x=a.key; y=b.key; return x<y?-dir:(x>y?dir:0); }
    if(k==="nick"){ x=merchNick(a.key).toLowerCase(); y=merchNick(b.key).toLowerCase(); return x<y?-dir:(x>y?dir:0); }
    if(k==="cats"){ x=(a.cats.length?catName(a.cats[0]):catName(a.cat)).toLowerCase();
                    y=(b.cats.length?catName(b.cats[0]):catName(b.cat)).toLowerCase();
                    return x<y?-dir:(x>y?dir:0); }
    if(k==="last"){ return (a.last<b.last?-1:(a.last>b.last?1:0))*dir; }
    if(k==="n"){ return (a.n-b.n)*dir; }
    if(k==="inn"){ return (a.inn-b.inn)*dir; }
    if(k==="net"){ return (a.net-b.net)*dir; }
    return (a.total-b.total)*dir;
  });
}

  var on=S.mFilter.sort===key;
  return '<th'+(cls?' class="'+cls+'"':"")+'><button class="sortable" data-msort="'+key+'"'+
    (on?' aria-sort="'+(S.mFilter.dir===1?"ascending":"descending")+'"':"")+'>'+label+
    '<span class="arr">'+(on?(S.mFilter.dir===1?"▲":"▼"):"◆")+'</span></button></th>';

var toastMsg="",toastT=null,mounted=false;

}
function showToast(){
  var old=document.querySelector(".toast"); if(old) old.remove();
  if(!toastMsg) return;
  var el=document.createElement("div"); el.className="toast"; el.textContent=toastMsg;
  document.body.appendChild(el);
}

function trySetup(){
  var api=(document.getElementById("su-api").value||"").trim();
  var who=(document.getElementById("su-who").value||"").trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(api)){ setupMsg="That doesn't look like an Apps Script web-app URL — it should start with https://script.google.com/macros/s/ and end in /exec."; render(); return; }
  var btn=document.getElementById("su-go"); btn.disabled=true; btn.textContent="Checking…";
  CFG.api=api; CFG.who=who; CFG.demo=false;
  call("getState").then(function(st){
    lsSet("fcfo-api",api); lsSet("fcfo-who",who); lsSet("fcfo-demo","");
    setupMsg=""; mounted=false;
    applyState(st); S.ready=true; render();
    toast("Connected. Welcome in.");
  }).catch(function(err){
    CFG.api="";
    setupMsg="Couldn't reach it: "+((err&&err.message)||"no answer")+" Check the deployment is set to “Anyone” and the URL ends in /exec.";
    render();
  });
}

/* ===================== boot & refresh ===================== */

function applyState(st){
  S.accounts=st.accounts||[]; S.cats=st.categories||[];
  S.rules=st.rules||{}; S.merchants=st.merchants||{}; S.goals=st.goals||[];
  S.contribs=st.contributions||[]; S.budgets=st.budgets||[]; S.recurring=st.recurring||[];
  S.txns=st.txns||[]; S.err="";
  if(!S.impAcct||!acctById(S.impAcct)) S.impAcct=(S.accounts[0]||{}).id||"";
}
function saveCache(st){
  if(CFG.demo) return;
  try{ localStorage.setItem("fcfo-cache",JSON.stringify(st)); }catch(e){}
}
/* The last copy of the ledger is kept on this device, so the app opens instantly and
   then catches up — Apps Script takes a second or two to answer. */
function boot(){
  if(!CFG.api&&!CFG.demo){ render(); return; }
  var cached=null;
  if(!CFG.demo){ try{ cached=JSON.parse(localStorage.getItem("fcfo-cache")||"null"); }catch(e){} }
  if(cached){ applyState(cached); S.ready=true; S.cached=true; }
  render();
  call("getState").then(function(st){ applyState(st); saveCache(st); S.ready=true; S.cached=false; render(); })
  .catch(function(err){
    S.ready=true;
    S.err=(cached?"Showing the copy saved on this device — couldn't reach the Sheet just now. ":"Couldn't reach the Sheet. ")+((err&&err.message)||"");
    render();
  });
}
function refresh(silent){
  if(!CFG.api&&!CFG.demo) return Promise.resolve();
  var btn=document.getElementById("refresh");
  if(btn) btn.classList.add("spin");
  return call("getState").then(function(st){
    applyState(st); saveCache(st); S.cached=false; render();
    var b=document.getElementById("refresh"); if(b) b.classList.remove("spin");
    if(!silent) toast("Up to date.");
  }).catch(function(){
    var b=document.getElementById("refresh"); if(b) b.classList.remove("spin");
    if(!silent) toast("Couldn't refresh just now.");
  });
}
document.addEventListener("visibilitychange",function(){
  if(!document.hidden&&S.ready&&!S.busy&&!S.imp&&!isEditing()) refresh(true);
});
setInterval(function(){ if(!document.hidden&&S.ready&&!S.busy&&!S.imp&&!isEditing()) refresh(true); },120000);
/* Don't redraw under someone mid-typing. */
function isEditing(){
  var a=document.activeElement;
  return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT");
}

/* ===================== theme ===================== */

function setTheme(t){
  if(t) document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  lsSet("fcfo-theme",t||"");
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute("data-theme");
  var dark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(cur==="dark"?"light":cur==="light"?"dark":(dark?"light":"dark"));
}
(function(){ var t=lsGet("fcfo-theme"); if(t) document.documentElement.setAttribute("data-theme",t); })();

/* ===================== chart hover ===================== */

function tipFor(el){ var box=el.closest(".chartbox"); return box?{box:box,tip:box.querySelector(".tip")}:null; }
function showTip(e,el){
  var t=tipFor(el); if(!t||!t.tip) return;
  var r=t.box.getBoundingClientRect();
  t.tip.innerHTML=el.getAttribute("data-tip");
  t.tip.style.display="block";
  var x=e.clientX-r.left+t.box.scrollLeft, y=e.clientY-r.top;
  var w=t.tip.offsetWidth/2;
  x=Math.max(w+4,Math.min(x,t.box.scrollWidth-w-4));
  t.tip.style.left=x+"px"; t.tip.style.top=Math.max(y,t.tip.offsetHeight+6)+"px";
}
document.addEventListener("mousemove",function(e){
  var el=e.target.closest&&e.target.closest("[data-tip]");
  document.querySelectorAll(".chartbox .tip").forEach(function(tp){
    if(!el||tp.parentNode!==el.closest(".chartbox")) tp.style.display="none";
  });
  if(el) showTip(e,el);
});

}
function go(view){

}

document.addEventListener("click",function(e){
  // first-run screen
  var b0=e.target.closest("button");
  if(b0&&b0.id==="su-go"){ trySetup(); return; }
  if(b0&&b0.id==="su-demo"){ CFG.demo=true; lsSet("fcfo-demo","1"); mounted=false; boot(); return; }

  if(e.target.id==="sheetbg"){ S.sheet=false; render(); return; }

  var tipEl=e.target.closest("[data-tip]");
  if(tipEl&&!tipEl.closest("[data-drill]")&&!tipEl.hasAttribute("data-drill")&&!tipEl.hasAttribute("data-inscat")){ showTip(e,tipEl); }

  var dr=e.target.closest("[data-drill]");

    S.drill=dr.getAttribute("data-drill"); S.drillMerch="";

  }
  var dm=e.target.closest("[data-drillmerch]");

  }
  var ic=e.target.closest("[data-inscat]");

  if(t.dataset.go){ if(t.dataset.revtab) S.revTab=t.dataset.revtab; go(t.dataset.go); return; }
  if(t.id==="more"){ S.sheet=!S.sheet; render(); return; }
  if(t.id==="themetog"||t.id==="themetog2"||t.id==="themetog3"){ toggleTheme(); S.sheet=false; render(); return; }
  if(t.id==="refresh"){ refresh(false); return; }
  if(t.id==="retry"){ S.err=""; render(); boot(); return; }
  if(t.dataset.importacct){ S.impAcct=t.dataset.importacct; if(S.imp) S.imp.acct=S.impAcct; go("import"); return; }

  if(t.dataset.insview){ S.ins.view=t.dataset.insview; S.ins.cat=""; render(); return; }
  if(t.id==="ins-back"){ S.ins.cat=""; render(); return; }
  if(t.dataset.revtab){ S.revTab=t.dataset.revtab; S.revIdx=0; S.dupIdx=0; render(); return; }
  if(t.dataset.donut){ S.donut=t.dataset.donut; render(); return; }
  if(t.dataset.smooth){ S.smooth=t.dataset.smooth==="1"; render(); return; }
  if(t.id==="bud-all"||t.id==="bud-all-show"){ S.budAll=!S.budAll; render(); return; }
  if(t.id==="rev-ask"){ askAbout(); return; }
  if(t.id==="rec-add-open"){
    S.recNew={q:"",key:"",label:"",cat:(S.cats.filter(function(c){return c.group==="spend";})[0]||{}).id||"",
              cadence:"year",amount:0,spread:true};
    render(); return;
  }
  if(t.id==="rec-add-close"){ S.recNew=null; render(); return; }
  if(t.id==="rec-add-save"){ saveNewRecurring(); return; }
  if(t.dataset.recpick){ pickRecurringMerchant(t.dataset.recpick); return; }
  if(t.id==="rec-unpick"){ S.recNew.key=""; render(); return; }
  if(t.dataset.recprice){ S.recNew.amount=+t.dataset.val||0; render(); return; }
  if(t.dataset.recdrop){ S.recDrop=t.dataset.recdrop; render(); return; }
  if(t.id==="rec-drop-cancel"){ S.recDrop=""; render(); return; }
  if(t.dataset.recdel){ removeRecurring(t.dataset.recdel); return; }
  if(t.dataset.merge){ mergeMerchants(t.dataset.merge,t.dataset.from); return; }
  if(t.dataset.merchopen){ S.merchOpen=(S.merchOpen===t.dataset.merchopen)?"":t.dataset.merchopen; render(); return; }
  if(t.dataset.merchedit){ S.merchEdit=(S.merchEdit===t.dataset.merchedit)?"":t.dataset.merchedit; render(); return; }
  if(t.dataset.merchdone){ S.merchEdit=""; render(); return; }
  if(t.dataset.merchtoggle){ toggleMerchCat(t.dataset.merchtoggle,t.dataset.cid); return; }
  if(t.dataset.merchclear){ setMerchCats(t.dataset.merchclear,[]); return; }
  if(t.dataset.msort){
    var mk=t.dataset.msort;
    if(S.mFilter.sort===mk) S.mFilter.dir=-S.mFilter.dir;
    else { S.mFilter.sort=mk; S.mFilter.dir=(mk==="key"||mk==="nick"||mk==="cats")?1:-1; }
    render(); return;
  }
  if(t.id==="m-clear"){ S.mFilter.q=""; S.mFilter.cat=""; render(); return; }
  if(t.id==="mprev"||t.id==="mnext"){ S.month=shiftMonth(S.month,t.id==="mnext"?1:-1); render(); return; }

  if(t.id==="drill-back"){ S.drill=""; S.drillMerch=""; render(); return; }
  if(t.id==="drill-clearmerch"){ S.drillMerch=""; render(); return; }
  if(t.id==="drill-open"){

  if(t.id==="imp-parse"){ doParse(document.getElementById("imp-paste").value); return; }
  if(t.id==="imp-cancel"){ S.imp=null; render(); return; }
  if(t.id==="imp-flip"){ if(S.imp){ S.imp.flip=!S.imp.flip; rebuildImport(); } return; }
  if(t.id==="imp-commit"){ commitImport(); return; }
  if(t.id==="exportcsv"){ exportCsv(); return; }

  if(t.dataset.assign){ assign(t.dataset.assign); return; }
  if(t.id==="rev-skip"){ S.revIdx++; render(); return; }
  if(t.id==="dup-skip"){ S.dupIdx++; render(); return; }

  if(t.dataset.dupdel){ dropDuplicate(t.dataset.dupdel,t.dataset.alsoclear||""); return; }

  if(t.id==="g-add"){

    if(!name) return;

  }
  if(t.dataset.goalsave){
    var inp=document.querySelector('[data-goaladd="'+t.dataset.goalsave+'"]');
    var amt=+inp.value||0; if(!amt) return;

      .then(function(){ toast("Contribution added."); refresh(true); })
      .catch(function(){ toast("Couldn't save that contribution."); refresh(true); });
    return;
  }
  if(t.dataset.goaldel){
    var gid=t.dataset.goaldel;
    S.goals=S.goals.filter(function(g){ return g.id!==gid; });
    S.contribs=S.contribs.filter(function(c){ return c.goalId!==gid; });
    render();
    call("deleteContributionsFor",gid).then(function(){ return call("saveGoals",S.goals); })
      .then(function(){ toast("Goal removed."); }).catch(function(){ toast("Couldn't remove that goal."); });
    return;
  }

  if(t.id==="acct-add"){
    S.accounts.push({id:"a"+Date.now().toString(36),label:"New account",bank:"",owner:"",url:""});
    render(); push("saveAccounts",S.accounts,"Account added."); return;
  }
  if(t.dataset.acctdel){
    S.accounts=S.accounts.filter(function(a){ return a.id!==t.dataset.acctdel; });
    render(); push("saveAccounts",S.accounts,"Account removed."); return;
  }
  if(t.id==="cat-add"){
    var el=document.getElementById("cat-new"), nm=el.value.trim(); if(!nm) return;
    S.cats.push({id:"c"+Date.now().toString(36),name:nm,group:"spend",budget:0});

  if(t.dataset.catdel){
    S.cats=S.cats.filter(function(c){ return c.id!==t.dataset.catdel; });
    render(); push("saveCategories",S.cats,"Category removed."); return;
  }
  if(t.dataset.reassign){ reassignBatch(t.dataset.reassign,t); return; }
  if(t.dataset.batchask){ S.confirmBatch=t.dataset.batchask; render(); return; }
  if(t.id==="batch-cancel"){ S.confirmBatch=""; render(); return; }
  if(t.dataset.batchdel){ removeBatch(t.dataset.batchdel,t); return; }

  if(t.id==="dev-share"){ copySetupLink(); return; }
  if(t.id==="dev-change"){ CFG.api=""; CFG.demo=false; lsSet("fcfo-demo",""); setupMsg=""; S.ready=false; render(); return; }
  if(t.id==="dev-forget"){

    CFG.api=""; CFG.who=""; CFG.demo=false; S.ready=false; setupMsg=""; render(); return;
  }
});

function copySetupLink(){
  var base=location.href.split("#")[0];
  var link=base+"#api="+encodeURIComponent(CFG.api);
  function done(){ toast("Setup link copied. Their name is set on first open."); }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(done,function(){ window.prompt("Copy this link:",link); });
  } else window.prompt("Copy this link:",link);

/* A browser download now that the app isn't inside Apps Script's frame. */
function exportCsv(){
  var list=filteredTxns();
  function q(s){ return '"'+String(s==null?"":s).replace(/"/g,'""')+'"'; }
  var lines=["Date,Merchant,Description,Account,Category,Amount"].concat(list.map(function(t){
    return [t.date,q(txnLabel(t)),q(t.desc),q(acctLabel(t.acct)),q(catName(t.cat)),(+t.amount).toFixed(2)].join(",");
  }));
  var blob=new Blob([lines.join("\n")],{type:"text/csv"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="family-cfo-"+(S.filter.period==="month"?S.month:S.filter.period)+".csv";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  toast("Exported "+list.length+" transaction"+(list.length===1?"":"s")+".");
}

/* ===================== merchants ===================== */

function merchEnsure(key){
  if(!S.merchants[key]) S.merchants[key]={nick:"",cats:[]};
  if(!S.merchants[key].cats) S.merchants[key].cats=[];
  return S.merchants[key];
}
function setNickname(key,name){
  merchEnsure(key).nick=name||"";
  render();
  push("saveMerchants",S.merchants,null);
}
function setMerchCats(key,cats){
  merchEnsure(key).cats=cats;
  render();
  push("saveMerchants",S.merchants,null);
}
function toggleMerchCat(key,catId){
  var cur=merchCats(key).slice();
  var i=cur.indexOf(catId);
  if(i===-1) cur.push(catId); else cur.splice(i,1);
  setMerchCats(key,cur);
}

/* Change what a merchant files under, and move every transaction that matches. */
function refileMerchant(key,catId){
  if(!catId) return;
  merchEnsure(key).cats=[catId];
  push("saveMerchants",S.merchants,null);
  var patches=[];
  S.txns.forEach(function(t){
    if(merchantKey(t.desc)===key && t.cat!==catId){
      t.cat=catId;
      patches.push({id:t.id,cat:catId});
    }
  });
  S.rules[key]=catId;
  render();
  var p=patches.length?call("patchTxns",patches):Promise.resolve();
  p.then(function(){ return call("saveRules",S.rules); })
   .then(function(){
     toast(patches.length
       ? "Moved "+patches.length+" transaction"+(patches.length===1?"":"s")+" to "+catName(catId)+"."
       : keyName(key)+" will file under "+catName(catId)+" from now on.");
   })
   .catch(function(){ toast("That didn't save — refresh and try again."); });
}

/* ===================== budget edits ===================== */

function setBudgetCell(catId,amount){
  S.budgets=S.budgets.filter(function(b){ return !(b.cat===catId&&b.month===S.month); });
  if(amount!==null) S.budgets.push({month:S.month,cat:catId,amount:amount});
  render();
  call("setBudget",S.month,catId,amount)
    .catch(function(){ toast("Budget didn't save — refresh and try again."); });
}

function applyWizard(btn){
  var w=S.wizard; if(!w) return;
  var end=shiftMonth(S.month,-1);
  var entries=S.cats.filter(function(c){ return c.group==="spend"; }).map(function(c){
    var vals=[];
    for(var i=0;i<w.basis;i++) vals.push(Math.abs(monthCat(shiftMonth(end,-i),c.id)));
    var v=w.method==="median"?median(vals):vals.reduce(function(a,b){ return a+b; },0)/w.basis;
    return {cat:c.id,amount:Math.round(v/w.round)*w.round};
  }).filter(function(e){ return e.amount>0||budgetFor(e.cat,S.month)>0; });

  btn.disabled=true;
  S.budgets=S.budgets.filter(function(b){
    return !(b.month===S.month && entries.some(function(e){ return e.cat===b.cat; }));
  }).concat(entries.map(function(e){ return {month:S.month,cat:e.cat,amount:e.amount}; }));
  S.wizard=null; render();
  call("setBudgets",S.month,entries)
    .then(function(){ toast("Plan set for "+ymLabel(S.month)+" onward."); })
    .catch(function(){ toast("Those didn't save — refresh and try again."); refresh(true); });
}

/* ===================== import ===================== */

function doParse(text){
  if(!text||!text.trim()) return;
  var acct=S.impAcct||(S.accounts[0]||{}).id;
  var res=readStatement(text);
  if(res.warn){ S.imp={warn:res.warn}; render(); return; }
  S.imp={acct:acct,raw:res.rows,map:res.map,flip:false};
  rebuildImport();
}

function rebuildImport(){
  var d=S.imp; if(!d||!d.raw) return;
  var sign=d.flip?-1:1;
  var rows=d.raw.map(function(r){ return {date:r.date,desc:r.desc,amount:r.amount*sign}; });

  // Identity is decided by CONTENT, not by a stored id — so a row someone edited
  // by hand in the Sheet, or one imported under an older scheme, still matches.
  var haveId={},occ={};
  S.txns.forEach(function(t){
    haveId[t.id]=true;
    var b=baseKey(t.date,t.amount,t.desc);
    occ[b]=(occ[b]||0)+1;
  });
  // Near-miss checks run against the LEDGER only, never against other rows in this
  // same file — a statement is authoritative about its own contents.
  var pool=S.txns;

  var dupes=0,matched=0,flags=0,inSum=0,outSum=0,fresh=[],seq={};
  rows.forEach(function(r){
    var b=baseKey(r.date,r.amount,r.desc);
    var n=(seq[b]||0); seq[b]=n+1;
    var id=txnId(r.date,r.amount,r.desc,n);
    if(n<(occ[b]||0)||haveId[id]){ dupes++; return; }

    var cat=guessCategory(r.desc);
    if(cat) matched++;
    if(r.amount>0) inSum+=r.amount; else outSum+=r.amount;
    var near=findNearDuplicate(pool,r);
    if(near) flags++;
    fresh.push({id:id,date:r.date,desc:r.desc,amount:r.amount,acct:d.acct,
                cat:cat||"",goal:"",dupOf:near?near.id:"",by:"",at:""});
  });
  d.rows=rows; d.fresh=fresh; d.dupes=dupes; d.matched=matched; d.flags=flags; d.inSum=inSum; d.outSum=outSum;
  render();
}

function findNearDuplicate(pool,r){
  var m=normMerchant(r.desc), day=dayNum(r.date);
  for(var i=0;i<pool.length;i++){
    var t=pool[i];
    if(Math.abs(t.amount-r.amount)>0.004) continue;
    var tm=normMerchant(t.desc), td=dayNum(t.date);
    if(t.date===r.date&&tm!==m) return t;
    if(tm===m&&td!==day&&Math.abs(td-day)<=DUP_DAYS) return t;
  }
  return null;
}

function commitImport(){
  var d=S.imp; if(!d||!d.fresh||!d.fresh.length||S.busy) return;
  S.busy=true; render();
  var payload=d.fresh.map(function(t){
    return {id:t.id,date:t.date,desc:t.desc,acct:t.acct,cat:t.cat,amount:t.amount,dupOf:t.dupOf};
  });
  call("importTxns",payload,CFG.who||"").then(function(res){
    S.busy=false;
    var n=res.added, needed=d.fresh.length-d.matched, flags=d.flags;
    var last=d.fresh.map(function(t){ return t.date.slice(0,7); }).sort().pop();
    S.imp=null;
    if(last) S.month=last;
    S.revIdx=0; S.dupIdx=0;
    S.view=(needed>0||flags>0)?"review":"overview";
    S.revTab=needed>0?"cat":"dup";
    if(CFG.demo){
      var now=todayIso()+" "+new Date().toTimeString().slice(0,5);
      d.fresh.forEach(function(t){ t.by=CFG.who||""; t.at=now; S.txns.push(t); });
    }
    render();
    (CFG.demo?Promise.resolve():refresh(true)).then(function(){
      toast("Added "+n+" transaction"+(n===1?"":"s")+
        (needed>0?" · "+needed+" need a category":"")+
        (flags>0?" · "+flags+" to double-check":"")+
        (needed<=0&&flags<=0?", all sorted automatically.":"."));
    });
  }).catch(function(err){
    S.busy=false; render();
    toast("Import failed — "+((err&&err.message)||"nothing was saved."));
  });
}

/* ===================== review ===================== */

function assign(catId){
  var q=unreviewed(); if(!q.length) return;
  var t=q[Math.min(S.revIdx,q.length-1)];
  var remember=(document.getElementById("rev-remember")||{}).checked;
  var key=merchantKey(t.desc);
  var patches=[],done={};
  S.txns.forEach(function(x){
    if(x.id===t.id||(remember&&!x.cat&&key&&normMerchant(x.desc).indexOf(key)!==-1)){
      if(done[x.id]) return;
      done[x.id]=true; x.cat=catId;
      patches.push({id:x.id,cat:catId});
    }
  });
  if(remember&&key) S.rules[key]=catId;
  render();
  call("patchTxns",patches).then(function(){
    if(remember&&key) return call("saveRules",S.rules);
  }).catch(function(){ toast("That didn't save — refresh and try again."); });
}

/* Mark the merchant on the review card as one that spans several categories. */
function askAbout(){
  var q=unreviewed(); if(!q.length) return;
  var t=q[Math.min(S.revIdx,q.length-1)];
  var key=merchantKey(t.desc); if(!key) return;

  var seen={};
  allTxns().forEach(function(x){ if(merchantKey(x.desc)===key&&x.cat) seen[x.cat]=1; });
  var cats=Object.keys(seen);
  if(cats.length<2){
    S.rules[key]=ASK;
    render();
    call("saveRules",S.rules)
      .then(function(){ toast(keyName(key)+" will be asked about every time."); })
      .catch(function(){ toast("That didn't save — refresh and try again."); });
    return;
  }
  setMerchCats(key,cats);
  toast(keyName(key)+" can be "+cats.map(catName).join(", ")+" — you'll be asked each time.");
}

function pickRecurringMerchant(key){
  var n=S.recNew; if(!n) return;
  var p=priceOptions(key);
  n.key=key;
  if(p){
    n.amount=p.distinct>1 ? p.median : p.latest;
    if(p.cat) n.cat=p.cat;
  }
  render();
}

function saveNewRecurring(){
  var n=S.recNew; if(!n) return;
  var key=n.key||normMerchant(n.q||n.label).split(" ").slice(0,3).join(" ");
  if(!key){ toast("Find or name a merchant first."); return; }
  if(!n.amount){ toast("Give it an amount first."); return; }
  if(n.label) merchEnsure(key).nick=n.label;
  var label=n.label||keyName(key);
  S.recNew=null;
  upsertRecurring(key,{label:"",cat:n.cat,cadence:n.cadence,amount:n.amount,spread:n.spread,source:"manual",active:true});
  if(label) push("saveMerchants",S.merchants,null);
  toast("Added "+label+".");
}

function removeRecurring(key){
  var detected=detectRecurring().some(function(d){ return d.key===key; });
  S.recurring=S.recurring.filter(function(r){ return r.key!==key; });
  if(detected){
    S.recurring.push({key:key,label:"",cat:"",cadence:"month",amount:0,
                      spread:false,source:"auto",active:false});
  }
  S.recDrop="";
  render();
  push("saveRecurring",S.recurring,"Removed.");
}

function setCatNick(key,catId,name){
  var e=merchEnsure(key);
  if(!e.catNames) e.catNames={};
  if(name) e.catNames[catId]=name; else delete e.catNames[catId];
  render();
  push("saveMerchants",S.merchants,null);
}

/* Fold every merchant starting with `prefix` into one. Prefix matching does the rest. */
function mergeMerchants(prefix,fromKey){
  var src=merchEntry(fromKey)||{};
  var absorbed=merchantRoster().filter(function(m){
    return m.key!==prefix&&(m.key===prefix||m.key.indexOf(prefix+" ")===0);
  }).length;
  Object.keys(S.merchants).forEach(function(k){
    if(k!==prefix&&k.indexOf(prefix+" ")===0) delete S.merchants[k];
  });
  var e=merchEnsure(prefix);
  if(!e.nick) e.nick=src.nick||titleCase(prefix);
  if(!(e.cats&&e.cats.length)&&src.cats) e.cats=src.cats.slice();
  if(!e.catNames&&src.catNames) e.catNames=src.catNames;

  S.merchOpen=prefix; S.merchEdit="";
  render();
  call("saveMerchants",S.merchants)
    .then(function(){ toast("Grouped "+absorbed+" merchant"+(absorbed===1?"":"s")+" under "+keyName(prefix)+"."); })
    .catch(function(){ toast("That didn't save — refresh and try again."); });
}

function clearFlag(id){
  var t=byId(id); if(t) t.dupOf="";
  render();
  call("patchTxns",[{id:id,dupOf:""}]).catch(function(){ toast("That didn't save."); });
}

function dropDuplicate(deleteId,alsoClearId){
  var patches=[];
  if(alsoClearId){
    var keep=byId(alsoClearId);
    if(keep) keep.dupOf="";
    patches.push({id:alsoClearId,dupOf:""});
  }
  S.txns=S.txns.filter(function(t){ return t.id!==deleteId; });
  S.txns.forEach(function(t){
    if(t.dupOf===deleteId){ t.dupOf=""; patches.push({id:t.id,dupOf:""}); }
  });
  render();
  var p=patches.length?call("patchTxns",patches):Promise.resolve();
  p.then(function(){ return call("deleteTxns",[deleteId]); })
   .then(function(){ toast("Deleted."); })
   .catch(function(){ toast("Couldn't delete that one — refresh and try again."); });
}

/* ===================== batches ===================== */

function findBatch(key){
  var all=batches();
  for(var i=0;i<all.length;i++) if(all[i].key===key) return all[i];
  return null;
}
function reassignBatch(key,btn){
  var b=findBatch(key); if(!b) return;
  var sel=document.querySelector('[data-batchacct="'+key+'"]');
  var newAcct=sel?sel.value:"";
  if(!newAcct||newAcct===b.acct){ toast("Pick a different account first."); return; }
  var patches=b.rows.map(function(t){ t.acct=newAcct; return {id:t.id,acct:newAcct}; });
  btn.disabled=true; render();
  call("patchTxns",patches).then(function(){
    toast("Moved "+patches.length+" transaction"+(patches.length===1?"":"s")+" to "+acctLabel(newAcct)+".");
    refresh(true);
  }).catch(function(){ toast("That didn't save — refresh and try again."); refresh(true); });
}
function removeBatch(key,btn){
  var b=findBatch(key); if(!b) return;
  var ids=b.rows.map(function(t){ return t.id; });
  var drop={}; ids.forEach(function(i){ drop[i]=true; });
  btn.disabled=true;
  S.txns=S.txns.filter(function(t){ return !drop[t.id]; });
  S.txns.forEach(function(t){ if(drop[t.dupOf]) t.dupOf=""; });
  S.confirmBatch=""; render();
  call("deleteTxns",ids)
    .then(function(){ toast("Removed "+ids.length+" transaction"+(ids.length===1?"":"s")+"."); refresh(true); })
    .catch(function(){ toast("Couldn't remove that import — refresh and try again."); refresh(true); });
}

/* ===================== start ===================== */

boot();

})();
</script>
