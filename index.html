<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Family CFO</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family CFO">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f7f9fc; --rail:#edf1f6;
  --ink:#0b1220; --ink-2:#46536a; --muted:#7a869a; --line:#e4e9f0; --line-2:#d3dae5;
  --accent:#2f6bff; --accent-soft:#eaf0ff; --accent-ink:#1d4fd8;
  --good:#0f9d6b; --good-soft:#e5f6ee; --warn:#e39a00; --warn-ink:#8a5d00; --warn-soft:#fff4d9;
  --crit:#e03a3f; --crit-soft:#fdecec;
  /* categorical slots (validated reference palette) */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#9aa3b2;
  /* ordinal ramp for the treemap — biggest share, darkest step */
  --tm1:#103a7a; --tf1:#ffffff; --tm2:#1c55a6; --tf2:#ffffff; --tm3:#2a78d6; --tf3:#ffffff;
  --tm4:#5598e7; --tf4:#0b0b0b; --tm5:#86b6ef; --tf5:#0b0b0b;
  --side:#0b1220; --side-2:#121b2d; --side-line:#1b2539; --side-ink:#c9d3e3; --side-muted:#6c7a93; --side-hi:#ffffff;
  --shadow:0 1px 2px rgba(11,18,32,.04), 0 6px 18px -10px rgba(11,18,32,.18);
  --r:12px;
}
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#070b14; --surface:#0f1626; --surface-2:#131b2d; --rail:#1a2338;
    --ink:#e8edf6; --ink-2:#aab5c8; --muted:#76839a; --line:#1c2539; --line-2:#29344c;
    --accent:#4d82ff; --accent-soft:#152149; --accent-ink:#93b2ff;
    --good:#34c38f; --good-soft:#0f2a20; --warn:#f0b43a; --warn-ink:#f0b43a; --warn-soft:#2a2312;
    --crit:#f0686c; --crit-soft:#2d1518;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#6b7588;
    --tm1:#9ec5f4; --tf1:#0b0b0b; --tm2:#6da7ec; --tf2:#0b0b0b; --tm3:#3987e5; --tf3:#ffffff;
    --tm4:#256abf; --tf4:#ffffff; --tm5:#184f95; --tf5:#ffffff;
    --side:#04070e; --side-2:#0c1322; --side-line:#141d30;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.9);
  }
}
html[data-theme="dark"]{
  color-scheme: dark;
  --bg:#070b14; --surface:#0f1626; --surface-2:#131b2d; --rail:#1a2338;
  --ink:#e8edf6; --ink-2:#aab5c8; --muted:#76839a; --line:#1c2539; --line-2:#29344c;
  --accent:#4d82ff; --accent-soft:#152149; --accent-ink:#93b2ff;
  --good:#34c38f; --good-soft:#0f2a20; --warn:#f0b43a; --warn-ink:#f0b43a; --warn-soft:#2a2312;
  --crit:#f0686c; --crit-soft:#2d1518;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#6b7588;
  --tm1:#9ec5f4; --tf1:#0b0b0b; --tm2:#6da7ec; --tf2:#0b0b0b; --tm3:#3987e5; --tf3:#ffffff;
  --tm4:#256abf; --tf4:#ffffff; --tm5:#184f95; --tf5:#ffffff;
  --side:#04070e; --side-2:#0c1322; --side-line:#141d30;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.45;
  -webkit-text-size-adjust:100%;font-feature-settings:"cv11","ss01"}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.neg{color:var(--crit)} .pos{color:var(--good)}
.muted{color:var(--muted)} .small{font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;width:232px;flex:0 0 232px;background:var(--side);color:var(--side-ink);
  display:flex;flex-direction:column;border-right:1px solid var(--side-line);z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 18px;font-weight:700;font-size:15.5px;letter-spacing:-.01em;color:var(--side-hi)}
.brand .logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,#2f6bff,#14c4ff);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 6px 16px -6px rgba(47,107,255,.8)}
.brand .logo svg{width:16px;height:16px}
.brand small{display:block;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--side-muted);margin-top:1px}
.side nav{padding:4px 10px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1 1 auto}
.side .grp{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--side-muted);padding:16px 10px 6px}
.side nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;cursor:pointer;
  padding:8px 10px;border-radius:8px;color:var(--side-ink);font-size:13.5px;font-weight:500;text-align:left;position:relative}
.side nav button svg{width:17px;height:17px;flex:0 0 auto;opacity:.75}
.side nav button:hover{background:var(--side-2);color:var(--side-hi)}
.side nav button[aria-current="page"]{background:var(--side-2);color:var(--side-hi)}
.side nav button[aria-current="page"] svg{opacity:1;color:#6f9bff}
.side nav button[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.badge{margin-left:auto;background:var(--crit);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:0 6px;line-height:17px;min-width:18px;text-align:center}
.side-foot{padding:12px 14px 16px;border-top:1px solid var(--side-line);font-size:12px;color:var(--side-muted);display:flex;flex-direction:column;gap:8px}
.side-foot .row{display:flex;align-items:center;gap:8px}
.side-foot button{background:var(--side-2);border:1px solid var(--side-line);color:var(--side-ink);border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer}
.side-foot button:hover{color:var(--side-hi)}
.dot{width:7px;height:7px;border-radius:99px;background:var(--good);display:inline-block;flex:0 0 auto}
.dot.busy{background:var(--warn);animation:pulse 1s ease-in-out infinite}
.dot.off{background:var(--crit)}
@keyframes pulse{50%{opacity:.35}}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(10px);
  -webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
.top .crumb{font-size:12px;color:var(--muted);margin-top:1px}
.top .tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.wrap{max-width:1240px;width:100%;margin:0 auto;padding:6px 28px 96px}
.iconbtn{background:var(--surface);border:1px solid var(--line-2);border-radius:9px;width:34px;height:34px;
  display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink-2)}
.iconbtn svg{width:16px;height:16px}
.iconbtn:hover{border-color:var(--muted);color:var(--ink)}
.iconbtn.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.monthpick{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;height:34px}
.monthpick button{background:none;border:0;cursor:pointer;padding:0 10px;height:100%;color:var(--ink-2);font-size:16px;line-height:1}
.monthpick button:hover{color:var(--ink);background:var(--rail)}
.monthpick .lbl{font-size:13px;font-weight:600;min-width:84px;text-align:center}

/* mobile chrome */
.mtop{display:none}
.bnav{display:none}
.sheet-bg{position:fixed;inset:0;background:rgba(4,7,14,.55);z-index:60;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--side);color:var(--side-ink);border-radius:18px 18px 0 0;
  padding:10px 12px calc(16px + env(safe-area-inset-bottom));display:none}
.sheet .grab{width:38px;height:4px;border-radius:9px;background:var(--side-line);margin:0 auto 10px}
.sheet nav{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sheet nav button{display:flex;align-items:center;gap:10px;background:var(--side-2);border:1px solid var(--side-line);
  border-radius:10px;padding:12px;color:var(--side-ink);font-weight:500;cursor:pointer;text-align:left}
.sheet nav button svg{width:18px;height:18px}
.sheet-open .sheet,.sheet-open .sheet-bg{display:block}
@media (max-width:899px){
  .side{display:none}
  .top{position:sticky}
  .top-in{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;gap:10px}
  .top h1{font-size:18px}
  .top .crumb{display:none}
  .top .brandmini{display:grid}
  .wrap{padding:4px 14px calc(92px + env(safe-area-inset-bottom))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--side);border-top:1px solid var(--side-line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1 1 0;background:none;border:0;color:var(--side-muted);display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;font-weight:500;padding:5px 0;cursor:pointer;position:relative}
  .bnav button svg{width:21px;height:21px}
  .bnav button[aria-current="page"]{color:#fff}
  .bnav button[aria-current="page"] svg{color:#6f9bff}
  .bnav .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0}
}
.brandmini{display:none;width:30px;height:30px;border-radius:8px;place-items:center;background:linear-gradient(135deg,#2f6bff,#14c4ff)}
.brandmini svg{width:16px;height:16px}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.panel-h h2{font-size:14px;font-weight:600;letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
.panel-h .sub{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
.panel-h .more{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--accent-ink);background:none;border:0;cursor:pointer;padding:0}
.panel-h .more:hover{text-decoration:underline}
.kicker{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grid{display:grid;gap:16px;margin-top:16px}
.grid > *{min-width:0}
@media(min-width:900px){
  .grid.two{grid-template-columns:1fr 1fr}
  .grid.dash{grid-template-columns:repeat(12,1fr)}
  .c4{grid-column:span 4} .c5{grid-column:span 5} .c6{grid-column:span 6} .c7{grid-column:span 7} .c8{grid-column:span 8} .c12{grid-column:span 12}
  .grid.side-r{grid-template-columns:minmax(0,1fr) 340px}
}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--rail)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--crit)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.link{border:0;background:none;padding:0;color:var(--accent-ink);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{
  background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label.fld{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:600}

.intro{color:var(--ink-2);font-size:13.5px;margin:10px 0 0;max-width:820px}
.sechead{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:30px 0 0}
.sechead + .small{color:var(--muted);margin-top:3px}

.banner{display:flex;gap:10px;align-items:center;border-radius:10px;padding:10px 13px;font-size:13px;
  margin-top:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)}
.banner b{color:var(--ink)}
.banner.demo{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft);color:var(--accent-ink)}
.banner.demo b{color:var(--accent-ink)}
.banner.bad{border-color:var(--crit);background:var(--crit-soft);color:var(--crit)}
.banner > button,.banner > a{margin-left:auto}

.seg{display:inline-flex;background:var(--rail);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:25px;font-weight:600;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
.tile .d{font-size:12px;color:var(--ink-2);margin-top:5px}
.tile.lead::after{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),#14c4ff)}
.tile .track{margin-top:10px}

/* ---------- bars / budget rows ---------- */
.bars{padding:6px 16px 14px}
.bar-row{padding:10px 0;border-bottom:1px solid var(--line)}
.bar-row:last-child{border-bottom:0}
button.bar-row{display:block;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer}
button.bar-row:hover .name{color:var(--accent-ink)}
.bar-top{display:flex;align-items:baseline;gap:8px;font-size:13.5px}
.bar-top .name{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-top .vals{margin-left:auto;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.bar-top .vals b{color:var(--ink);font-weight:600}
.track{position:relative;height:8px;border-radius:5px;background:var(--rail);margin-top:7px;overflow:hidden}
.track.thin{height:6px}
.fill{position:absolute;inset-block:0;left:0;border-radius:5px;background:var(--accent)}
.fill.warn{background:var(--warn)}
.fill.over{background:var(--crit)}
.fill.good{background:var(--good)}
.pin{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-2);opacity:.55}
.pct{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:99px;padding:1px 8px;white-space:nowrap}
.chip.over,.chip.up{background:var(--crit-soft);color:var(--crit)}
.chip.ok,.chip.down{background:var(--good-soft);color:var(--good)}
.chip.flag{background:var(--rail);color:var(--ink-2)}
.chip.info{background:var(--accent-soft);color:var(--accent-ink)}
.chip.year{background:var(--warn-soft);color:var(--warn-ink)}

/* budget table (Monarch-style) */
.btable{width:100%;border-collapse:collapse;min-width:0;font-size:13.5px}
.btable th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;
  padding:12px 12px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.btable td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.btable tr.grp td{background:var(--surface-2);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 12px}
.btable tr.grp td .num{letter-spacing:0;font-size:12px;color:var(--ink-2)}
.btable td.r,.btable th.r{text-align:right}
.btable .cname{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-align:left;color:var(--ink)}
.btable .cname:hover{color:var(--accent-ink)}
.btable .meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btable input.bin{width:96px;text-align:right;padding:4px 8px}
.btable .carry{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.btable .carry button{background:none;border:0;padding:0;color:var(--accent-ink);cursor:pointer;font-size:10.5px}
.btable tbody tr:hover td{background:var(--surface-2)}
.show-s{display:none}
@media(max-width:640px){ .btable .hide-s{display:none} .btable input.bin{width:76px} .show-s{display:block;margin-top:6px} .btable td{padding:10px 8px} .btable .meta .chip{white-space:normal} .btable .meta{gap:4px 8px} }

/* ---------- charts ---------- */
.chartbox{padding:8px 10px 12px;overflow-x:auto;position:relative}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;padding:10px 16px 0;font-size:12px;color:var(--ink-2);align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:2px;border-radius:0;vertical-align:3px;width:14px}
.legend i.dash{height:0;border-top:2px dashed var(--muted);background:none!important;vertical-align:3px;width:14px;border-radius:0}
svg text{font-family:Inter,sans-serif}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:7px;
  white-space:nowrap;z-index:5;box-shadow:var(--shadow);transform:translate(-50%,-110%);display:none}
.tip b{font-family:"JetBrains Mono",monospace}
.donutwrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px 16px;justify-content:center}
.donutwrap svg{flex:0 0 auto}
.donutwrap path{cursor:pointer}
.dlegend{flex:1 1 190px;min-width:0}
.dlegend button{display:flex;width:100%;align-items:baseline;gap:8px;background:none;border:0;padding:6px 0;
  cursor:pointer;text-align:left;font-size:12.5px;border-bottom:1px solid var(--line)}
.dlegend button:last-child{border-bottom:0}
.dlegend button:hover .nm{color:var(--accent-ink)}
.dlegend i{width:10px;height:10px;border-radius:3px;flex:0 0 auto;position:relative;top:1px}
.dlegend .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlegend .vv{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600}
.dlegend .pp{font-family:"JetBrains Mono",monospace;color:var(--muted);font-size:11.5px;width:38px;text-align:right}

(function readHash(){
  var h=location.hash.replace(/^#/,""); if(!h) return;
  var p={}; h.split("&").forEach(function(kv){
    var i=kv.indexOf("="); if(i>0) p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));

  if(p.who) lsSet("fcfo-who",p.who);

    method:"POST", redirect:"follow",

function ymKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }

function ymLong(k){ var p=k.split("-"); return ["January","February","March","April","May","June","July","August","September","October","November","December"][+p[1]-1]+" "+p[0]; }
function shiftMonth(k,n){ var p=k.split("-").map(Number); return ymKey(new Date(p[0],p[1]-1+n,1)); }
function daysInMonth(k){ var p=k.split("-").map(Number); return new Date(p[0],p[1],0).getDate(); }
function todayIso(){ var d=new Date(); return ymKey(d)+"-"+String(d.getDate()).padStart(2,"0"); }
function catById(id){ for(var i=0;i<S.cats.length;i++) if(S.cats[i].id===id) return S.cats[i]; return null; }
/* Every list you pick a category from is alphabetical — the Categories table keeps its
   own order, because that's where the order is defined. */
function catsSorted(fn){
  return S.cats.filter(fn||function(){ return true; })
    .slice().sort(function(a,b){
      var x=a.name.toLowerCase(), y=b.name.toLowerCase();
      return x<y?-1:(x>y?1:0);
    });
}
function catOptions(selected,fn){
  return catsSorted(fn).map(function(c){
    return '<option value="'+c.id+'"'+(selected===c.id?" selected":"")+'>'+esc(c.name)+'</option>';
  }).join("");
}
function catName(id){ var c=catById(id); return c?c.name:""; }
function acctById(id){ for(var i=0;i<S.accounts.length;i++) if(S.accounts[i].id===id) return S.accounts[i]; return null; }
function dayNum(iso){ return Math.floor(Date.parse(iso+"T00:00:00Z")/86400000); }
function isoFromDay(n){ return new Date(n*86400000).toISOString().slice(0,10); }
function median(a){
  if(!a.length) return 0;
  var s=a.slice().sort(function(x,y){ return x-y; });
  var m=Math.floor(s.length/2);
  return s.length%2?s[m]:(s[m-1]+s[m])/2;
}

/* ===================== formatting ===================== */

function money(n,cents){
  var neg=n<0, v=Math.abs(n);
  var s=v.toLocaleString("en-US",{minimumFractionDigits:cents?2:0,maximumFractionDigits:cents?2:0});
  return (neg?"−$":"$")+s;
}
function kfmt(v){
  if(v===0) return "$0";
  if(Math.abs(v)>=1000) return "$"+(v/1000).toFixed(Math.abs(v)%1000?1:0)+"k";
  return "$"+Math.round(v);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function safeUrl(u){ u=String(u||"").trim(); return /^https?:\/\//i.test(u)?u:""; }
function ago(iso){
  if(!iso) return "never";
  var d=dayNum(todayIso())-dayNum(iso.slice(0,10));
  if(d<=0) return "today"; if(d===1) return "yesterday";
  if(d<45) return d+" days ago";
  return Math.round(d/30)+" months ago";
}

function normMerchant(desc){
  var s=String(desc||"").toLowerCase();
  s=s.replace(/^(sq \*|tst\*|sp |pp\*|paypal \*|pos debit |debit card purchase |recurring card purchase |purchase authorized on \d+\/\d+ )/g," ");
  s=s.replace(/https?:\/\/\S+/g," ").replace(/www\.|\.com|\.net|\.org/g," ");
  s=s.replace(/#\s*\d+/g," ").replace(/\b\d{3,}\b/g," ").replace(/\b\d+\b/g," ");
  s=s.replace(/[^a-z ]+/g," ").replace(/\s+/g," ").trim();
  s=s.replace(/\b(ca|az|tx|ny|fl|wa|or|ut|nv|id|co|nm|usa|us)\b$/,"").trim();
  return s;
}
/* The key every merchant is grouped, nicknamed and ruled by.
   Banks pad the same store with extra words — "COSTCO WHSE #1122" one month and
   "COSTCO WHSE #1122 TEMPE" the next — which would split it in two. So once you've
   named or configured a merchant, anything starting with that name joins it. */
var MKC={};
function merchantKey(desc){
  var n=normMerchant(desc); if(!n) return "";
  if(MKC[n]!==undefined) return MKC[n];
  var best="",k,i;
  for(k in S.merchants){
    if(k&&(n===k||n.indexOf(k+" ")===0)&&k.length>best.length) best=k;
  }
  for(i=0;i<S.recurring.length;i++){
    k=S.recurring[i].key;
    if(k&&(n===k||n.indexOf(k+" ")===0)&&k.length>best.length) best=k;
  }
  return (MKC[n]=best||n.split(" ").slice(0,3).join(" "));
}
function titleCase(s){ return String(s||"").replace(/\b\w/g,function(c){ return c.toUpperCase(); }); }
function merchEntry(k){ return S.merchants[k]||null; }
function merchNick(k){ var e=merchEntry(k); return (e&&e.nick)||""; }
/* The categories this merchant is allowed to be. Two or more means "ask me". */
function merchCats(k){
  var e=merchEntry(k);
  return (e&&e.cats?e.cats:[]).filter(function(c){ return catById(c); });
}
function merchantName(desc){
  var k=merchantKey(desc);
  return merchNick(k) || (k?titleCase(k):String(desc||"").trim().slice(0,40));
}
function keyName(k){ return merchNick(k) || titleCase(k) || "—"; }

/* A merchant that covers several categories can be named per category — so Costco
   reads as "Costco Groceries" on one line and "Costco Gas" on the next. */
function catNickOf(key,catId){
  var e=merchEntry(key);
  return (e&&e.catNames&&e.catNames[catId])||"";
}
function txnLabel(t){
  var k=merchantKey(t.desc);
  return catNickOf(k,t.cat) || keyName(k);
}
function acctLabel(id){ return (acctById(id)||{}).label||"—"; }
function shortDate(iso){ return iso?iso.slice(5).replace("-","/")+"/"+iso.slice(2,4):""; }
function mdDate(iso){ return iso?MONTH_NAMES[+iso.slice(5,7)-1]+" "+(+iso.slice(8,10)):""; }

/* Returns a category id, ASK, or null. */
function resolveRule(desc){
  var n=normMerchant(desc); if(!n) return null;
  // What you've said this merchant can be always wins.
  var mc=merchCats(merchantKey(desc));
  if(mc.length>1) return ASK;
  if(mc.length===1) return mc[0];
  if(S.rules[n]) return S.rules[n];
  var best=null,len=0,k;
  for(k in S.rules){ if(k && n.indexOf(k)!==-1 && k.length>len){ best=S.rules[k]; len=k.length; } }
  if(best) return best;
  for(k in SEED_RULES){ if(n.indexOf(k)!==-1 && k.length>len){ best=SEED_RULES[k]; len=k.length; } }
  return best;
}
function guessCategory(desc){
  var r=resolveRule(desc);
  if(!r||r===ASK) return null;          // ASK means: don't guess, ask me
  return catById(r)?r:null;
}
function isAskMerchant(desc){ return resolveRule(desc)===ASK; }

/* ===================== identity ===================== */

function baseKey(date,amount,desc){ return date+"|"+Number(amount).toFixed(2)+"|"+normMerchant(desc); }
function hash(s){
  var h=5381;
  for(var i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0;
  return h.toString(36);
}
function txnId(date,amount,desc,occurrence){
  return date.replace(/-/g,"")+"-"+hash(baseKey(date,amount,desc))+"-"+occurrence;
}

/* ===================== CSV ===================== */

function parseCSV(text){
  var rows=[],row=[],field="",q=false;
  var t=String(text).replace(/\r\n?/g,"\n");
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ field+='"'; i++; } else q=false; } else field+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(field); field=""; }
    else if(c==="\n"){ row.push(field); rows.push(row); row=[]; field=""; }
    else field+=c;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){ return String(x).trim()!==""; }); });
}
function findCol(hdr,pats){
  for(var p=0;p<pats.length;p++) for(var i=0;i<hdr.length;i++) if(pats[p].test(hdr[i])) return i;
  return -1;
}
function parseDate(v){
  var s=String(v||"").trim(),m;
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){ var y=m[3]; if(y.length===2) y="20"+y; return y+"-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0"); }
  var d=new Date(s);
  if(!isNaN(d)) return ymKey(d)+"-"+String(d.getDate()).padStart(2,"0");
  return null;
}
function parseAmt(v){
  var s=String(v==null?"":v).trim(); if(!s) return null;
  var neg=/^\(.*\)$/.test(s);
  s=s.replace(/[()$,\s]/g,"");
  if(s.charAt(0)==="-"){ neg=true; s=s.slice(1); }
  if(s.charAt(0)==="+") s=s.slice(1);
  if(s===""||isNaN(Number(s))) return null;
  return neg?-Number(s):Number(s);
}
function readStatement(text){
  var grid=parseCSV(text);
  if(grid.length<2) return {rows:[],warn:"That file has no data rows."};
  var hdr=grid[0].map(function(h){ return String(h).trim().toLowerCase(); });
  var iDate=findCol(hdr,[/^transaction date$/,/^trans\.? date$/,/^date$/,/^posting date$/,/^post date$/,/date/]);
  var iDesc=findCol(hdr,[/^description$/,/^payee$/,/^merchant$/,/description/,/details/,/memo/]);
  var iAmt =findCol(hdr,[/^amount$/,/amount/]);
  var iDeb =findCol(hdr,[/^debit$/,/debit/]);
  var iCred=findCol(hdr,[/^credit$/,/credit/]);
  if(iDate<0||iDesc<0) return {rows:[],warn:"Couldn't find a date and a description column in that file."};
  if(iAmt<0&&iDeb<0&&iCred<0) return {rows:[],warn:"Couldn't find an amount (or debit/credit) column."};
  var rows=[];
  for(var r=1;r<grid.length;r++){
    var g=grid[r],date=parseDate(g[iDate]);
    if(!date) continue;
    var amt=null;
    if(iAmt>=0) amt=parseAmt(g[iAmt]);
    if(amt==null&&(iDeb>=0||iCred>=0)){
      var d=iDeb>=0?parseAmt(g[iDeb]):null, c=iCred>=0?parseAmt(g[iCred]):null;
      if(d!=null||c!=null) amt=(c||0)-Math.abs(d||0);
    }
    if(amt==null||amt===0) continue;
    rows.push({date:date,desc:String(g[iDesc]||"").trim(),amount:amt});
  }
  return {rows:rows,warn:"",map:{
    date:hdr[iDate]||"date", desc:hdr[iDesc]||"description",
    amount: iAmt>=0?(hdr[iAmt]||"amount"):((iDeb>=0?hdr[iDeb]:"")+" / "+(iCred>=0?hdr[iCred]:""))
  }};
}

function isDemo(){ return S.ready && S.txns.length===0; }
function allTxns(){ return isDemo()?SAMPLE:S.txns; }

/* ===================== postings & monthly index ===================== */

/* A posting is "this much of this transaction belongs to this month". Normally
   that's the whole amount in the month it happened. For a charge marked to spread
   — an annual subscription — it's an equal share across the months it covers, so
   one $180 bill in January doesn't read as a January blowout. */
var POSTINGS=[], MI={};

function recCfg(key){
  for(var i=0;i<S.recurring.length;i++) if(S.recurring[i].key===key) return S.recurring[i];
  return null;
}
function spreadMonths(desc){
  if(!S.smooth) return 1;
  var c=recCfg(merchantKey(desc));
  if(!c||!c.spread||c.active===false) return 1;
  return cadenceBy(c.cadence).months;
}

function buildIndex(){
  POSTINGS=[]; MI={}; MKC={};
  allTxns().forEach(function(t){
    var c=catById(t.cat); if(!c) return;
    var om=t.date.slice(0,7);
    var n=(c.group==="spend")?spreadMonths(t.desc):1;
    var mk=merchantKey(t.desc);
    for(var i=0;i<n;i++){
      POSTINGS.push({m:shiftMonth(om,i),om:om,cat:t.cat,grp:c.group,amt:t.amount/n,mk:mk});
    }
  });
  POSTINGS.forEach(function(p){
    var m=MI[p.m]||(MI[p.m]={cat:{},income:0,spend:0});
    if(p.grp==="transfer") return;
    if(p.grp==="income") m.income+=p.amt; else m.spend+=-p.amt;
    m.cat[p.cat]=(m.cat[p.cat]||0)+(p.grp==="income"?p.amt:-p.amt);
  });
}
function monthCat(k,catId){ return (MI[k]&&MI[k].cat[catId])||0; }
function monthSpend(k){ return (MI[k]&&MI[k].spend)||0; }
function monthIncome(k){ return (MI[k]&&MI[k].income)||0; }

/* Average monthly spend for a category across the n months ending at endMonth. */
function trailingAvg(catId,n,endMonth){
  var sum=0;
  for(var i=0;i<n;i++) sum+=Math.abs(monthCat(shiftMonth(endMonth,-i),catId));
  return sum/n;
}

/* ===================== budgets ===================== */

function budgetFor(catId,month){
  var best=null;
  for(var i=0;i<S.budgets.length;i++){
    var b=S.budgets[i];
    if(b.cat!==catId||b.month>month) continue;
    if(!best||b.month>best.month) best=b;
  }
  if(best) return best.amount;
  var c=catById(catId);
  return c?(+c.budget||0):0;
}
function hasOverrideAt(catId,month){
  return S.budgets.some(function(b){ return b.cat===catId&&b.month===month; });
}
function plannedTotal(month){
  return S.cats.filter(function(c){ return c.group==="spend"; })
    .reduce(function(a,c){ return a+budgetFor(c.id,month); },0);
}
/* A plan for a multi-month window is the sum of each month's plan. */
function plannedOver(months){
  return months.reduce(function(a,k){ return a+plannedTotal(k); },0);
}

/* ===================== periods ===================== */

var PERIODS=[
  ["month","Selected month"],["prevmonth","Month before that"],["last3","Last 3 months"],
  ["quarter","Quarter to date"],["ytd","Year to date"],["year","This year"],["lastyear","Last year"],
  ["12m","Last 12 months"],["all","All time"],["custom","Custom dates…"]
];
function periodRange(kind,month){
  var y=+month.slice(0,4), m=+month.slice(5,7);
  function first(yy,mm){ return yy+"-"+String(mm).padStart(2,"0")+"-01"; }
  function last(yy,mm){ return yy+"-"+String(mm).padStart(2,"0")+"-"+String(new Date(yy,mm,0).getDate()).padStart(2,"0"); }
  if(kind==="custom"){
    return {from:S.ins.from||first(y,m), to:S.ins.to||last(y,m)};
  }
  if(kind==="prevmonth"){
    var pm=shiftMonth(month,-1);
    return {from:first(+pm.slice(0,4),+pm.slice(5,7)), to:last(+pm.slice(0,4),+pm.slice(5,7))};
  }
  switch(kind){
    case "last3":    var s=shiftMonth(month,-2); return {from:first(+s.slice(0,4),+s.slice(5,7)),to:last(y,m)};
    case "quarter":  var qs=Math.floor((m-1)/3)*3+1; return {from:first(y,qs),to:last(y,m)};
    case "ytd":      return {from:first(y,1),to:last(y,m)};
    case "year":     return {from:first(y,1),to:last(y,12)};
    case "lastyear": return {from:first(y-1,1),to:last(y-1,12)};
    case "12m":      var t=shiftMonth(month,-11); return {from:first(+t.slice(0,4),+t.slice(5,7)),to:last(y,m)};
    case "all":      return {from:"0000-01-01",to:"9999-12-31"};
    default:         return {from:first(y,m),to:last(y,m)};
  }
}
function periodLabel(kind,month){
  var y=+month.slice(0,4), m=+month.slice(5,7);
  if(kind==="custom"){ var r=periodRange(kind,month); return r.from+" → "+r.to; }
  if(kind==="prevmonth") return ymLabel(shiftMonth(month,-1));
  switch(kind){
    case "last3":    return ymLabel(shiftMonth(month,-2))+" – "+ymLabel(month);
    case "quarter":  return "Q"+(Math.floor((m-1)/3)+1)+" "+y+" to date";
    case "ytd":      return y+" to date";
    case "year":     return String(y);
    case "lastyear": return String(y-1);
    case "12m":      return ymLabel(shiftMonth(month,-11))+" – "+ymLabel(month);
    case "all":      return "All time";
    default:         return ymLabel(month);
  }
}
/* The months a period covers, oldest first — capped so "all time" stays sane. */
function periodMonths(kind,month){
  if(kind==="all"){
    var ks=Object.keys(MI).sort();
    return ks.length?ks:[month];
  }
  var r=periodRange(kind,month), out=[], k=r.from.slice(0,7), end=r.to.slice(0,7), guard=0;
  while(k<=end && guard++<400){ out.push(k); k=shiftMonth(k,1); }
  return out.length?out:[month];
}

/* ===================== analysis ===================== */

function summarizeMonths(months,from,to){
  var set={}; months.forEach(function(k){ set[k]=1; });
  var income=0,spend=0,byCat={},byMerch={};
  POSTINGS.forEach(function(p){
    if(!set[p.m]||p.grp==="transfer") return;
    if(p.grp==="income"){ income+=p.amt; byCat[p.cat]=(byCat[p.cat]||0)+p.amt; }
    else {
      spend+=-p.amt;
      byCat[p.cat]=(byCat[p.cat]||0)+(-p.amt);
      byMerch[p.mk]=(byMerch[p.mk]||0)+(-p.amt);
    }
  });
  var txns=[],unknown=0;
  allTxns().forEach(function(t){
    if(t.date<from||t.date>to) return;
    txns.push(t);
    if(!t.cat||!catById(t.cat)) unknown++;
  });
  return {txns:txns,income:income,spend:spend,net:income-spend,byCat:byCat,byMerch:byMerch,unknown:unknown};
}
function merchantsIn(catId,months){
  var set={}; months.forEach(function(k){ set[k]=1; });
  var m={};
  POSTINGS.forEach(function(p){
    if(p.cat!==catId||!set[p.m]||p.grp!=="spend") return;
    m[p.mk]=(m[p.mk]||0)+(-p.amt);
  });
  return Object.keys(m).map(function(k){ return {key:k,name:keyName(k),value:m[k]}; })
    .sort(function(a,b){ return b.value-a.value; });
}

/* What this period is measured against — a trailing average, or the same window a year ago. */
function baselineFor(catId,months){
  if(S.compare==="yoy"){
    return months.reduce(function(a,k){ return a+Math.abs(monthCat(shiftMonth(k,-12),catId)); },0);
  }
  var n=+S.compare, end=shiftMonth(months[0],-1);
  return trailingAvg(catId,n,end)*months.length;
}
function baselineSpend(months){
  if(S.compare==="yoy"){
    return months.reduce(function(a,k){ return a+monthSpend(shiftMonth(k,-12)); },0);
  }
  var n=+S.compare, end=shiftMonth(months[0],-1), sum=0;
  for(var i=0;i<n;i++) sum+=monthSpend(shiftMonth(end,-i));
  return (sum/n)*months.length;
}
function baselineLabel(months){
  if(S.compare!=="yoy") return S.compare+"-mo avg";
  return months.length===1 ? ymLabel(shiftMonth(months[0],-12)) : "same period last year";
}
function unreviewed(){
  return S.txns.filter(function(t){ return !t.cat; }).sort(function(a,b){ return a.date<b.date?1:-1; });
}
function flagged(){
  return S.txns.filter(function(t){ return t.dupOf; }).sort(function(a,b){ return a.date<b.date?1:-1; });
}
function byId(id){ for(var i=0;i<S.txns.length;i++) if(S.txns[i].id===id) return S.txns[i]; return null; }
function goalProgress(g){
  var sum=0;
  S.contribs.forEach(function(c){ if(c.goalId===g.id) sum+=c.amount; });
  S.txns.forEach(function(t){ if(t.goal===g.id) sum+=Math.abs(t.amount); });
  return sum;
}
function batches(){
  var map={};
  S.txns.forEach(function(t){
    var key=(t.by||"?")+"|"+(t.at||"?")+"|"+t.acct;
    if(!map[key]) map[key]={key:key,by:t.by||"",at:t.at||"",acct:t.acct,rows:[],min:t.date,max:t.date};
    var b=map[key]; b.rows.push(t);
    if(t.date<b.min) b.min=t.date;
    if(t.date>b.max) b.max=t.date;
  });
  return Object.keys(map).map(function(k){ return map[k]; })
    .sort(function(a,b){ return a.at<b.at?1:(a.at>b.at?-1:0); });
}
/* Where each account stands: its newest transaction and when it was last imported. */
function accountStatus(){
  var st={};
  S.accounts.forEach(function(a){ st[a.id]={acct:a,latest:"",imported:"",by:"",n:0}; });
  allTxns().forEach(function(t){
    var s=st[t.acct]; if(!s) return;
    s.n++;
    if(t.date>s.latest) s.latest=t.date;
    if(t.at&&t.at>s.imported){ s.imported=t.at; s.by=t.by||""; }
  });
  return S.accounts.map(function(a){
    var s=st[a.id];
    s.stale=!s.latest||(dayNum(todayIso())-dayNum(s.latest))>STALE_DAYS;
    return s;
  });
}
/* Every merchant the ledger has seen, with what it's filed under. */
function merchantRoster(){
  var m={};
  allTxns().forEach(function(t){
    var k=merchantKey(t.desc); if(!k) return;
    var e=m[k]||(m[k]={key:k,n:0,total:0,inn:0,net:0,cats:{},last:""});
    e.n++;
    if(t.amount<0) e.total+=-t.amount; else e.inn+=t.amount;
    e.net=e.inn-e.total;
    if(t.cat) e.cats[t.cat]=(e.cats[t.cat]||0)+1;
    if(t.date>e.last) e.last=t.date;
  });
  return Object.keys(m).map(function(k){
    var e=m[k];
    var best="",n=0,count=0;
    for(var c in e.cats){ count++; if(e.cats[c]>n){ n=e.cats[c]; best=c; } }
    e.cat=best;
    e.nCats=count;                       // how many it has actually been filed under
    e.cats=merchCats(e.key);             // how many you've said it may be
    e.ask=e.cats.length>1||S.rules[e.key]===ASK;
    return e;
  }).sort(function(a,b){ return b.total-a.total; });
}

/* Recurring charges: same merchant, steady amount, steady gap. */
function detectRecurring(){
  var groups={};
  allTxns().forEach(function(t){
    if(t.amount>=0) return;
    var c=catById(t.cat);
    if(!c||c.group!=="spend") return;
    var k=merchantKey(t.desc); if(!k) return;
    (groups[k]=groups[k]||[]).push(t);
  });
  var out=[];
  Object.keys(groups).forEach(function(k){
    var rows=groups[k].slice().sort(function(a,b){ return a.date<b.date?-1:1; });
    if(rows.length<2) return;
    var amts=rows.map(function(r){ return Math.abs(r.amount); });
    var med=median(amts);
    if(med<1) return;
    // A subscription charges about the same amount every time. Anything that
    // wanders more than a few percent is shopping, not a subscription.
    var spread=median(amts.map(function(a){ return Math.abs(a-med); }));
    if(spread/med>0.06) return;
    var gaps=[];
    for(var i=1;i<rows.length;i++) gaps.push(dayNum(rows[i].date)-dayNum(rows[i-1].date));
    var g=median(gaps);
    // …and it arrives on a regular beat, not just on average
    var gmad=median(gaps.map(function(x){ return Math.abs(x-g); }));
    if(gmad>Math.max(4,g*0.2)) return;
    var cad=null;
    for(var j=0;j<CADENCES.length;j++) if(g>=CADENCES[j].lo&&g<=CADENCES[j].hi) cad=CADENCES[j];
    if(!cad) return;
    if(cad.per!=="year"&&cad.per!=="6 months"&&rows.length<3) return;
    var lastRow=rows[rows.length-1];
    var prior=amts.slice(0,-1);
    var last=amts[amts.length-1];
    var wasMed=prior.length?median(prior):last;
    var changed=Math.abs(last-wasMed)/Math.max(wasMed,1)>0.05;
    out.push({
      key:k, name:keyName(k), cat:lastRow.cat, cadence:cad,
      amount:last, typical:med, perMonth:last*cad.perMonth,
      count:rows.length, lastDate:lastRow.date,
      nextDate:isoFromDay(dayNum(lastRow.date)+Math.round(g)),
      changed:changed, was:wasMed, rows:rows
    });
  });
  return out.sort(function(a,b){ return b.perMonth-a.perMonth; });
}

/* Everything the ledger knows about one merchant, for entries you added by hand. */
function statsFor(key){
  return allTxns().filter(function(t){ return merchantKey(t.desc)===key&&t.amount<0; })
    .sort(function(a,b){ return a.date<b.date?-1:1; });
}

/* Detection merged with your own edits: rename, re-file, change the cadence, mark it
   to spread, or drop it. A dismissed entry stays dismissed. */
function recurringList(){
  var cfg={}; S.recurring.forEach(function(r){ cfg[r.key]=r; });
  var out=[], seen={};

  detectRecurring().forEach(function(a){
    var c=cfg[a.key];
    if(c&&c.active===false) return;
    seen[a.key]=1;
    if(c){
      a.name=c.label||a.name;
      if(c.cat) a.cat=c.cat;
      if(c.cadence) a.cadence=cadenceBy(c.cadence);
      if(c.amount) a.amount=c.amount;
      a.spread=!!c.spread;
      a.source=c.source||"auto";
    } else { a.spread=false; a.source="auto"; }
    a.perMonth=a.amount*a.cadence.perMonth;
    out.push(a);
  });

  S.recurring.forEach(function(c){
    if(seen[c.key]||c.active===false) return;
    var rows=statsFor(c.key), cad=cadenceBy(c.cadence);
    var last=rows.length?rows[rows.length-1]:null;
    out.push({
      key:c.key, name:c.label||keyName(c.key), cat:c.cat, cadence:cad,
      amount:c.amount||(last?Math.abs(last.amount):0),
      perMonth:(c.amount||(last?Math.abs(last.amount):0))*cad.perMonth,
      count:rows.length, lastDate:last?last.date:"",
      nextDate:last?isoFromDay(dayNum(last.date)+Math.round(365/12*cad.months)):"",
      changed:false, was:0, rows:rows, spread:!!c.spread, source:c.source||"manual", manualOnly:true
    });
  });

  out.forEach(function(s){ s.acct=lastAccountFor(s.rows); });
  return out.sort(function(a,b){ return b.perMonth-a.perMonth; });
}

/* Which card this charge lands on — the account of the most recent one. */
function lastAccountFor(rows){
  return (rows&&rows.length)?rows[rows.length-1].acct:"";
}

/* What a merchant typically costs, three ways, so adding one by hand can pre-fill. */
function priceOptions(key){
  var rows=statsFor(key);
  if(!rows.length) return null;
  var recent=rows.filter(function(r){ return dayNum(r.date)>=dayNum(todayIso())-400; });
  var use=recent.length?recent:rows;
  var amts=use.map(function(r){ return Math.abs(r.amount); });
  var uniq={}; amts.forEach(function(a){ uniq[a.toFixed(2)]=1; });
  return {
    latest:Math.abs(rows[rows.length-1].amount),
    avg:amts.reduce(function(a,b){ return a+b; },0)/amts.length,
    median:median(amts),
    n:rows.length,
    distinct:Object.keys(uniq).length,
    acct:lastAccountFor(rows),
    lastDate:rows[rows.length-1].date,
    cat:rows[rows.length-1].cat
  };
}

/* ===================== charts ===================== */
/* Every mark that carries a number has a data-tip; one hover handler shows it. */

function niceStep(max){
  var raw=max/4, mag=Math.pow(10,Math.floor(Math.log10(Math.max(raw,1))));
  var mult=[1,2,2.5,5,10].find(function(m){ return raw<=m*mag; })||10;
  return mult*mag;
}
function tipAttr(html){ return ' data-tip="'+esc(html)+'"'; }
function gridLines(W,padL,padR,padT,ih,top,step){
  var g="";
  for(var v=0;v<=top+0.001;v+=step){
    var y=padT+ih-(v/top)*ih;
    g+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
    g+='<text x="'+(padL-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="var(--muted)">'+kfmt(v)+'</text>';
  }
  return g;
}

/* Money in vs. money out, month by month: two series, so a legend sits above it. */
function trendChart(months){
  var W=640,H=220,padL=52,padR=14,padT=14,padB=30;
  var iw=W-padL-padR, ih=H-padT-padB;
  var max=Math.max.apply(null,[1].concat(months.map(function(m){ return Math.max(m.income,m.spend); })));
  var step=niceStep(max), top=Math.ceil(max/step)*step;
  var slot=iw/months.length, bw=Math.min(20,slot/2.8), gap=2, g=gridLines(W,padL,padR,padT,ih,top,step);
  months.forEach(function(m,i){
    var cx=padL+slot*i+slot/2, x1=cx-bw-gap/2, x2=cx+gap/2;
    var hi=Math.max(m.income>0?2:0,(m.income/top)*ih), hs=Math.max(m.spend>0?2:0,(m.spend/top)*ih);
    var tip='<b>'+esc(m.label)+'</b><br>In '+money(m.income)+' · Out '+money(m.spend)+' · Net '+money(m.income-m.spend);
    g+='<rect x="'+(padL+slot*i).toFixed(1)+'" y="'+padT+'" width="'+slot.toFixed(1)+'" height="'+ih+'" fill="transparent"'+tipAttr(tip)+'/>';
    if(hi) g+='<path d="'+roundTop(x1,padT+ih-hi,bw,hi,3)+'" fill="var(--s1)" pointer-events="none"/>';
    if(hs) g+='<path d="'+roundTop(x2,padT+ih-hs,bw,hs,3)+'" fill="var(--s2)" pointer-events="none"/>';
    g+='<text x="'+cx.toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+esc(m.short)+'</text>';
  });
  g+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(padT+ih)+'" y2="'+(padT+ih)+'" stroke="var(--line-2)" stroke-width="1"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:420px;display:block" role="img" aria-label="Income and spending by month">'+g+'</svg>';
}
/* A bar with rounded data-end and a square baseline. */
function roundTop(x,y,w,h,r){
  r=Math.min(r,w/2,h);
  return "M"+x.toFixed(1)+" "+(y+h).toFixed(1)+"V"+(y+r).toFixed(1)+"Q"+x.toFixed(1)+" "+y.toFixed(1)+" "+(x+r).toFixed(1)+" "+y.toFixed(1)+
    "H"+(x+w-r).toFixed(1)+"Q"+(x+w).toFixed(1)+" "+y.toFixed(1)+" "+(x+w).toFixed(1)+" "+(y+r).toFixed(1)+"V"+(y+h).toFixed(1)+"Z";
}

/* Cumulative spending through the month: this month against last month, with the
   plan's even pace dashed underneath. Hover any day to read all three. */
function spendCompareChart(month){
  var dim=daysInMonth(month), pm=shiftMonth(month,-1), pdim=daysInMonth(pm);
  function cumFor(k,n){
    var by={}, out=[], run=0;
    allTxns().forEach(function(t){
      if(t.date.slice(0,7)!==k) return;
      var c=catById(t.cat); if(!c||c.group!=="spend") return;
      var d=+t.date.slice(8,10); by[d]=(by[d]||0)+(-t.amount);
    });
    for(var d=1;d<=n;d++){ run+=by[d]||0; out.push(run); }
    return out;
  }
  var cur=cumFor(month,dim), prev=cumFor(pm,pdim);
  var now=new Date(), isCur=ymKey(now)===month, upto=isCur?now.getDate():(month>ymKey(now)?0:dim);
  var target=plannedTotal(month);
  var W=680,H=230,padL=52,padR=18,padT=16,padB=28, iw=W-padL-padR, ih=H-padT-padB;
  var peak=Math.max(1,target,prev[pdim-1]||0,cur[Math.max(upto,1)-1]||0);
  var step=niceStep(peak), top=Math.ceil(peak/step)*step;
  var x=function(d){ return padL+((d-1)/Math.max(dim-1,1))*iw; };
  var y=function(v){ return padT+ih-(v/top)*ih; };
  var g=gridLines(W,padL,padR,padT,ih,top,step);
  [1,8,15,22,dim].forEach(function(d){
    g+='<text x="'+x(d).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+MONTH_NAMES[+month.slice(5,7)-1]+' '+d+'</text>';
  });
  if(target>0){
    g+='<line x1="'+x(1).toFixed(1)+'" y1="'+y(0).toFixed(1)+'" x2="'+x(dim).toFixed(1)+'" y2="'+y(target).toFixed(1)+
       '" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>';
  }
  var pp=[];
  for(var d=1;d<=Math.min(pdim,dim);d++) pp.push(x(d).toFixed(1)+","+y(prev[d-1]).toFixed(1));
  if(pp.length>1) g+='<polyline points="'+pp.join(" ")+'" fill="none" stroke="var(--s6)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  var cp=[];
  for(d=1;d<=upto;d++) cp.push(x(d).toFixed(1)+","+y(cur[d-1]).toFixed(1));
  if(cp.length>1){
    g+='<polygon points="'+x(1).toFixed(1)+','+y(0).toFixed(1)+' '+cp.join(" ")+' '+x(upto).toFixed(1)+','+y(0).toFixed(1)+'" fill="var(--s1)" opacity=".08"/>';
    g+='<polyline points="'+cp.join(" ")+'" fill="none" stroke="var(--s1)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  if(upto>0){
    var lv=cur[upto-1];
    g+='<circle cx="'+x(upto).toFixed(1)+'" cy="'+y(lv).toFixed(1)+'" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>';
    var right=upto>dim*0.72;
    g+='<text x="'+(x(upto)+(right?-10:10)).toFixed(1)+'" y="'+(y(lv)-10).toFixed(1)+'" text-anchor="'+(right?"end":"start")+
       '" font-size="12" font-weight="600" fill="var(--ink)" font-family="JetBrains Mono,monospace">'+money(lv)+'</text>';
  }
  // hover columns: one per day
  var colW=iw/Math.max(dim-1,1);
  for(d=1;d<=dim;d++){
    var tip='<b>'+mdDate(month+"-"+String(d).padStart(2,"0"))+'</b>'+
      (d<=upto?'<br>This month '+money(cur[d-1]):'')+
      (d<=pdim?'<br>Last month '+money(prev[d-1]):'')+
      (target?'<br>Even pace '+money(target*d/dim):'');
    g+='<rect x="'+(x(d)-colW/2).toFixed(1)+'" y="'+padT+'" width="'+colW.toFixed(1)+'" height="'+ih+'" fill="transparent"'+tipAttr(tip)+'/>';
  }
  g+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--line-2)" stroke-width="1"/>';
  return {svg:'<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:460px;display:block" role="img" aria-label="Cumulative spending, this month against last month">'+g+'</svg>',
          cur:upto?cur[upto-1]:0, prevSame:prev[Math.min(Math.max(upto,1),pdim)-1]||0, prevTotal:prev[pdim-1]||0, target:target, upto:upto, dim:dim};
}

/* items: [{id,name,value}] -> five named slices plus a folded tail */
function foldSlices(items){
  var list=items.filter(function(x){ return x.value>0; }).sort(function(a,b){ return b.value-a.value; });
  var total=list.reduce(function(a,x){ return a+x.value; },0);
  if(!total) return {slices:[],total:0,tail:0};
  var named=[],tail=[];
  list.forEach(function(x,i){
    if(i<DONUT_SLICES && x.value/total>=DONUT_FLOOR) named.push(x); else tail.push(x);
  });
  var slices=named.map(function(x,i){
    return {id:x.id,name:x.name,value:x.value,color:SLICE_COLORS[i],pct:x.value/total};
  });
  if(tail.length){
    var tv=tail.reduce(function(a,x){ return a+x.value; },0);
    slices.push({id:"",name:"Other ("+tail.length+")",value:tv,color:OTHER_COLOR,pct:tv/total,isOther:true});
  }
  return {slices:slices,total:total,tail:tail.length};
}
function donutChart(slices,total,drillAttr,caption){
  var size=190,r=84,ir=58,cx=size/2,cy=size/2,gapDeg=1.6;
  var a=-90,g="";
  slices.forEach(function(s){
    var sweep=s.pct*360, a0=a+gapDeg/2, a1=a+sweep-gapDeg/2;
    if(a1>a0){
      var rad=function(d){ return d*Math.PI/180; };
      var x0=cx+r*Math.cos(rad(a0)),y0=cy+r*Math.sin(rad(a0));
      var x1=cx+r*Math.cos(rad(a1)),y1=cy+r*Math.sin(rad(a1));
      var xi1=cx+ir*Math.cos(rad(a1)),yi1=cy+ir*Math.sin(rad(a1));
      var xi0=cx+ir*Math.cos(rad(a0)),yi0=cy+ir*Math.sin(rad(a0));
      var big=(a1-a0)>180?1:0;
      var attr=(drillAttr&&s.id)?' data-'+drillAttr+'="'+esc(s.id)+'"':"";
      g+='<path'+attr+tipAttr('<b>'+esc(s.name)+'</b><br>'+money(s.value)+' · '+Math.round(s.pct*100)+'%')+' d="M'+x0.toFixed(1)+' '+y0.toFixed(1)+
         ' A'+r+' '+r+' 0 '+big+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+
         ' L'+xi1.toFixed(1)+' '+yi1.toFixed(1)+
         ' A'+ir+' '+ir+' 0 '+big+' 0 '+xi0.toFixed(1)+' '+yi0.toFixed(1)+
         ' Z" fill="'+s.color+'"></path>';
    }
    a+=sweep;
  });
  g+='<text x="'+cx+'" y="'+(cy+1)+'" text-anchor="middle" font-size="19" font-weight="600" fill="var(--ink)" font-family="JetBrains Mono,monospace">'+money(total)+'</text>';
  g+='<text x="'+cx+'" y="'+(cy+18)+'" text-anchor="middle" font-size="10" fill="var(--muted)" letter-spacing="1.2">'+esc((caption||"total spent").toUpperCase())+'</text>';
  return '<svg viewBox="0 0 '+size+' '+size+'" width="180" height="180" role="img" aria-label="Share of spending">'+g+'</svg>';
}

function categoryHistory(catId,endMonth,n){
  var W=640,H=230,padL=52,padR=14,padT=16,padB=30;
  var iw=W-padL-padR, ih=H-padT-padB;
  var months=[];
  for(var i=n-1;i>=0;i--){
    var k=shiftMonth(endMonth,-i);
    months.push({k:k,short:MONTH_NAMES[+k.slice(5,7)-1],actual:Math.abs(monthCat(k,catId)),budget:budgetFor(catId,k)});
  }
  var max=Math.max.apply(null,[1].concat(months.map(function(m){ return Math.max(m.actual,m.budget); })));
  var step=niceStep(max), top=Math.ceil(max/step)*step;
  var slot=iw/months.length, bw=Math.min(28,slot*0.56), g=gridLines(W,padL,padR,padT,ih,top,step);
  months.forEach(function(m,i){
    var cx=padL+slot*i+slot/2;
    var h=Math.max(m.actual>0?2:0,(m.actual/top)*ih);
    var over=m.budget>0&&m.actual>m.budget;
    var tip='<b>'+ymLabel(m.k)+'</b><br>Spent '+money(m.actual)+(m.budget?' of '+money(m.budget)+' plan':'');
    g+='<rect x="'+(padL+slot*i).toFixed(1)+'" y="'+padT+'" width="'+slot.toFixed(1)+'" height="'+ih+'" fill="transparent"'+tipAttr(tip)+'/>';
    if(h>0) g+='<path d="'+roundTop(cx-bw/2,padT+ih-h,bw,h,4)+'" fill="'+(over?"var(--crit)":"var(--accent)")+'" pointer-events="none"/>';
    g+='<text x="'+cx.toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+m.short+'</text>';
  });
  var seg=[];
  months.forEach(function(m,i){

    seg.push((i===0?"M":"L")+x0.toFixed(1)+" "+y.toFixed(1));
    seg.push("L"+x1.toFixed(1)+" "+y.toFixed(1));
  });

  g+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(padT+ih)+'" y2="'+(padT+ih)+'" stroke="var(--line-2)" stroke-width="1"/>';

}

/* ---------- treemap: the hundred-foot view ---------- */

function worstRatio(row,area,side){
  var thick=area/side, worst=1;
  for(var i=0;i<row.length;i++){
    var len=row[i].area/thick, r=Math.max(thick/len,len/thick);
    if(r>worst) worst=r;
  }
  return worst;
}
/* Squarified: rows are laid along the shorter side so cells stay near-square. */
function treemapLayout(items,W,H){
  var total=items.reduce(function(a,x){ return a+x.value; },0);
  if(!total) return [];
  var scale=(W*H)/total;
  var nodes=items.map(function(x){ return {item:x,area:x.value*scale}; });
  var out=[],x=0,y=0,w=W,h=H,i=0,guard=0;
  while(i<nodes.length&&guard++<500){
    var vertical=w>=h, side=vertical?h:w;
    if(side<=0) break;
    var row=[],rowArea=0,best=Infinity;
    while(i<nodes.length){
      var a=rowArea+nodes[i].area;
      var ratio=worstRatio(row.concat([nodes[i]]),a,side);
      if(!row.length||ratio<=best){ row.push(nodes[i]); rowArea=a; best=ratio; i++; }
      else break;
    }
    var thick=rowArea/side, off=0;
    row.forEach(function(n){
      var len=n.area/thick;
      if(vertical) out.push({item:n.item,x:x,y:y+off,w:thick,h:len});
      else out.push({item:n.item,x:x+off,y:y,w:len,h:thick});
      off+=len;
    });
    if(vertical){ x+=thick; w-=thick; } else { y+=thick; h-=thick; }
    if(w<0.5||h<0.5) break;
  }
  return out;
}
function treemapSVG(items,total){
  var W=760,H=340,pad=2;
  var cells=treemapLayout(items,W,H);
  if(!cells.length) return '<div class="empty">Nothing to show for this period.</div>';
  var g=cells.map(function(c,i){
    var rank=Math.min(i,4)+1;
    var bg=i<5?"var(--tm"+rank+")":"var(--rail)";
    var fg=i<5?"var(--tf"+rank+")":"var(--ink-2)";
    var pct=total?Math.round((c.item.value/total)*100):0;
    var s='<g><rect data-inscat="'+esc(c.item.id)+'"'+tipAttr('<b>'+esc(c.item.name)+'</b><br>'+money(c.item.value)+' · '+pct+'%')+' x="'+(c.x+pad/2).toFixed(1)+'" y="'+(c.y+pad/2).toFixed(1)+
      '" width="'+Math.max(0,c.w-pad).toFixed(1)+'" height="'+Math.max(0,c.h-pad).toFixed(1)+
      '" rx="5" fill="'+bg+'"></rect>';
    if(c.w>84&&c.h>40&&c.w>c.item.name.length*6.6+22){
      s+='<text x="'+(c.x+10).toFixed(1)+'" y="'+(c.y+22).toFixed(1)+'" font-size="13" font-weight="600" fill="'+fg+'" pointer-events="none">'+
         esc(c.item.name.length>18?c.item.name.slice(0,17)+"…":c.item.name)+'</text>';
      s+='<text x="'+(c.x+10).toFixed(1)+'" y="'+(c.y+39).toFixed(1)+'" font-size="12" fill="'+fg+'" opacity=".82" pointer-events="none">'+
         money(c.item.value)+' · '+pct+'%</text>';
    }
    return s+'</g>';
  }).join("");
  return '<svg class="tm" viewBox="0 0 '+W+' '+H+'" style="min-width:540px" role="img" aria-label="Spending by category, area is share">'+g+'</svg>';
}

/* ---------- small multiples: every category's shape at once ---------- */

function sparkBars(vals,max,over,labels){
  var W=146,H=36,n=vals.length,bw=W/n*0.68,g="";
  vals.forEach(function(v,i){
    var hh=max>0?Math.max(v>0?1.5:0,(v/max)*H):0;
    if(hh<=0) return;
    var cx=(i+0.5)*(W/n);
    g+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(H-hh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+
       '" rx="1.5" fill="'+((over&&over[i])?"var(--crit)":"var(--accent)")+'"/>';
  });
  g+='<line x1="0" x2="'+W+'" y1="'+H+'" y2="'+H+'" stroke="var(--line-2)" stroke-width="1"/>';
  return '<svg viewBox="0 0 '+W+' '+(H+1)+'" width="100%" height="'+(H+1)+'" aria-hidden="true">'+g+'</svg>';
}

/* ---------- insights comparison ---------- */

function insBaselineMonths(months){
  var n=months.length;
  if(S.ins.compare==="yoy") return months.map(function(k){ return shiftMonth(k,-12); });
  if(S.ins.compare==="prev"){
    var out=[];
    for(var i=n;i>0;i--) out.push(shiftMonth(months[0],-i));
    return out;
  }
  var t=+S.ins.compare, end=shiftMonth(months[0],-1), b=[];
  for(var j=0;j<t;j++) b.push(shiftMonth(end,-j));
  return b;
}
/* Only months with activity count toward the baseline, and the total is scaled back up
   to the current window's length — so a partly-empty comparison window doesn't invent
   a rise out of the months before the first import. */
function insBaseSum(months,pick){
  var b=insBaselineMonths(months);
  var live=b.filter(function(k){ return MI[k]&&(MI[k].spend>0||MI[k].income>0); });
  if(!live.length) return 0;
  var sum=live.reduce(function(a,k){ return a+pick(k); },0);
  return (sum/live.length)*months.length;
}
function insBaseCat(catId,months){
  return insBaseSum(months,function(k){ return Math.abs(monthCat(k,catId)); });
}
function insBaseSpend(months){
  return insBaseSum(months,function(k){ return monthSpend(k); });
}
/* How much of the comparison window we actually have data for. Comparing a full year
   against months that predate the first import invents rises that never happened. */
function insBaseCoverage(months){
  var b=insBaselineMonths(months);
  var have=b.filter(function(k){ return MI[k]&&(MI[k].spend>0||MI[k].income>0); }).length;
  return b.length?have/b.length:0;
}
function insBaseLabel(months){
  if(S.ins.compare==="yoy") return months.length===1?ymLabel(shiftMonth(months[0],-12)):"the year before";
  if(S.ins.compare==="prev") return months.length===1?ymLabel(shiftMonth(months[0],-1)):"the period before";
  return S.ins.compare+"-mo average";
}
function insDelta(now,base,months){
  var lbl=insBaseLabel(months);
  if(insBaseCoverage(months)<0.6) return '<span class="chip flag">not enough history</span>';
  if(!base) return '<span class="chip flag">nothing in '+esc(lbl)+'</span>';
  var d=now-base, pct=Math.round((d/base)*100);
  if(Math.abs(pct)<5) return '<span class="chip flag">flat vs '+esc(lbl)+'</span>';
  return '<span class="chip '+(d>0?"up":"down")+'">'+(d>0?"▲ +":"▼ −")+
    money(Math.abs(d)).replace("−","")+" ("+(d>0?"+":"−")+Math.abs(pct)+"%) vs "+esc(lbl)+"</span>";
}
